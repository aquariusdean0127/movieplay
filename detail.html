<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Details</title>
<style>
  :root {
    --accent: #e50914; --accent-2: #f6121d;
    --line: #2a2a33; --card: #1e1e25; --card-2: #26262f;
    --text: #f5f5f7; --muted: #8a8a94; --bg: #000;
    --warn: #f59e0b; --warn-bg: rgba(245,158,11,.08); --warn-bd: rgba(245,158,11,.35);
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  img { display: block; }

  /* ═══════════ UPGRADED BACKGROUND ═══════════ */
  .bg-blur {
    position: fixed; inset: -120px;
    background-size: cover;
    background-position: center;
    filter: blur(90px) brightness(0.42) saturate(1.8) contrast(1.05);
    z-index: -3;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
    will-change: opacity;
  }
  .bg-blur.visible { opacity: 1; }

  .bg-ambient {
    position: fixed; inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 12%, rgba(229,9,20,.14) 0%, transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(124,58,237,.10) 0%, transparent 44%);
    animation: bgAmbientPulse 12s ease-in-out infinite;
    opacity: .7;
  }
  @keyframes bgAmbientPulse {
    0%, 100% { opacity: .5; }
    50% { opacity: .9; }
  }

  .bg-overlay {
    position: fixed; inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(229,9,20,.08) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 100%, rgba(88,28,135,.06) 0%, transparent 55%),
      linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.72) 55%, #000 100%);
  }
  .bg-overlay::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: .055;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .bg-overlay::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.9) 100%);
    pointer-events: none;
  }

  .page { max-width: 1400px; margin: 0 auto; padding: 0 20px 100px; position: relative; }
  body.has-footer .page { padding-bottom: 160px; }

  /* ═══════════ TOPBAR ═══════════ */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    position: sticky; top: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.9) 55%, rgba(0,0,0,.5) 80%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 50;
    margin: 0 -20px;
  }
  .back-btn {
    width: 42px; height: 42px; border-radius: 10px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: .15s;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,.16); }
  .back-btn:active { transform: scale(.94); }
  .topbar h1 {
    font-size: 17px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }

  /* ═══════════ DETAIL CARD (modal-style hero) ═══════════ */
  .detail-card {
    position: relative;
    margin: 20px 0 36px;
    border-radius: 18px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid #24242c;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: heroIn .6s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes heroIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-hero {
    position: relative;
    height: 280px;
    background: #101014;
    overflow: hidden;
  }
  .detail-hero img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: .6;
  }
  .detail-hero::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(30,30,37,.1) 0%, rgba(30,30,37,.7) 55%, var(--card) 100%);
    pointer-events: none;
  }
  .hero-skel {
    position: absolute; inset: 0;
    background: linear-gradient(120deg, #101014 0%, #1a1a22 50%, #101014 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
  }

  .detail-body {
    position: relative;
    padding: 0 28px 28px;
    margin-top: -104px;
  }

  .detail-head {
    display: flex;
    gap: 22px;
    align-items: flex-end;
  }

  .detail-poster,
  .detail-poster-fallback {
    width: 160px; flex: none;
    aspect-ratio: 2/3;
    border-radius: 12px;
    object-fit: cover;
    background: #222;
    box-shadow: 0 16px 40px rgba(0,0,0,.7);
  }
  .detail-poster-fallback {
    background: linear-gradient(135deg, #1e1e25 0%, #2a2a33 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: 800;
    color: rgba(255,255,255,.15);
    letter-spacing: -2px;
  }

  .detail-meta { flex: 1; min-width: 0; }
  .detail-meta h2 {
    font-size: 32px; line-height: 1.15; font-weight: 800;
    letter-spacing: -.8px; margin-bottom: 10px;
    text-shadow: 0 2px 20px rgba(0,0,0,.5);
  }
  .title-skeleton {
    width: 60%; max-width: 480px;
    height: 36px; border-radius: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.12), rgba(255,255,255,.05));
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .detail-sub {
    display: flex; flex-wrap: wrap; gap: 6px 12px;
    font-size: 13.5px; color: #c3c3cd;
    margin-bottom: 14px; align-items: center;
    font-weight: 500;
  }
  .detail-sub .rating { color: #ffc93c; font-weight: 700; }
  .detail-sub .dot { color: var(--muted); opacity: .5; }
  .detail-sub .badge {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    padding: 2px 8px; border-radius: 4px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .6px;
    text-transform: uppercase; color: #fff;
  }

  .detail-tags {
    display: flex; flex-wrap: wrap; gap: 7px;
    margin-bottom: 16px;
  }
  .tag {
    font-size: 11.5px; padding: 4px 11px; border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: #c9c9d4;
    font-weight: 600;
  }

  .detail-actions {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center;
    margin-top: 4px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    transition: .15s;
  }
  .btn:hover { border-color: #4a4a58; background: #26262f; }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 6px 18px rgba(229,9,20,.32);
  }
  .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn-trailer {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.22);
    color: #fff;
  }
  .btn-trailer:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
  .btn-trailer svg { width: 15px; height: 15px; fill: currentColor; }
  .btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

  .detail-desc {
    margin-top: 22px;
    font-size: 14px;
    line-height: 1.65;
    color: #c3c3cd;
    white-space: pre-wrap;
  }

  @media (max-width: 720px) {
    .detail-card { margin: 12px 0 24px; border-radius: 14px; }
    .detail-hero { height: 200px; }
    .detail-body { padding: 0 18px 22px; margin-top: -80px; }
    .detail-poster, .detail-poster-fallback { width: 106px; }
    .detail-poster-fallback { font-size: 40px; }
    .detail-meta h2 { font-size: 22px; letter-spacing: -.5px; }
    .detail-sub { font-size: 12.5px; }
    .detail-desc { font-size: 13px; }
    .title-skeleton { height: 28px; }
  }

  /* ═══════════ CAST ═══════════ */
  .cast-section { margin: 8px 0 40px; }
  .section-title {
    font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--muted); font-weight: 800;
    margin-bottom: 16px;
  }
  .cast-scroller {
    display: flex; gap: 18px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 2px 12px;
    scroll-snap-type: x proximity;
  }
  .cast-scroller::-webkit-scrollbar { display: none; }
  .cast-card {
    flex-shrink: 0;
    width: 108px;
    text-align: center;
    scroll-snap-align: start;
    transition: transform .2s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cast-card:hover { transform: translateY(-2px); }
  .cast-card:active { transform: translateY(-1px) scale(.97); }
  .cast-photo {
    width: 108px; height: 108px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--card);
    border: 2px solid rgba(255,255,255,.1);
    margin: 0 auto 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transition: border-color .2s, box-shadow .2s;
  }
  .cast-card:hover .cast-photo {
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 20px rgba(229,9,20,.25);
  }
  .cast-photo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: rgba(255,255,255,.3);
    background: linear-gradient(135deg, #1e1e25 0%, #2a2a33 100%);
  }
  .cast-name {
    font-size: 13px;
    font-weight: 700;
    color: #f5f5f7;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
  }
  .cast-role {
    font-size: 11.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
  }
  @media (max-width: 720px) {
    .cast-card, .cast-photo { width: 88px; }
    .cast-photo { height: 88px; }
    .cast-name { font-size: 12px; }
    .cast-role { font-size: 10.5px; }
  }

  /* ═══════════ TABS ═══════════ */
  .tabs {
    display: flex; gap: 4px;
    border-bottom: 1px solid var(--line);
    margin: 12px 0 28px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent; border: none;
    color: var(--muted);
    padding: 16px 22px;
    font-size: 15px; font-weight: 700;
    position: relative; white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: .15s; margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: -.2px;
  }
  .tab:hover { color: #e5e5ea; }
  .tab.active { color: #fff; border-bottom-color: var(--accent); }
  .tab .tab-spinner {
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .section { margin-bottom: 36px; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    background: var(--card); border: 1px solid var(--line);
    color: #e5e5ea; padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
    transition: .15s;
  }
  .pill:hover { background: var(--card-2); border-color: #4a4a58; }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(229,9,20,.3); }

  .season-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .season-row label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .season-select {
    flex: 1; max-width: 340px;
    background: var(--card); border: 1px solid var(--line);
    color: #fff; padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer; outline: none;
    transition: .15s;
  }
  .season-select:hover { background: var(--card-2); }
  .season-select:focus { border-color: #4a4a58; }
  .episodes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 12px;
  }
  .ep-btn {
    background: var(--card); border: 1px solid var(--line);
    color: #e5e5ea; padding: 18px 6px;
    border-radius: 10px;
    font-size: 13.5px; font-weight: 700;
    transition: .15s; position: relative;
    letter-spacing: -.2px;
  }
  .ep-btn:hover { background: var(--card-2); border-color: #4a4a58; transform: translateY(-1px); }
  .ep-btn.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 6px 20px rgba(229,9,20,.35);
  }

  .play-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-top: 24px; padding-top: 26px; border-top: 1px solid var(--line);
  }
  .play-row .btn { padding: 16px 30px; font-size: 15px; }

  .loading-block {
    display: flex; align-items: center; gap: 14px;
    padding: 44px 24px; color: var(--muted); font-size: 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,.12);
    border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .unavailable-banner {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 22px 26px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-bd);
    border-radius: 12px;
    margin-top: 8px;
  }
  .unavailable-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(245,158,11,.15);
    display: flex; align-items: center; justify-content: center;
    color: var(--warn); font-size: 20px; font-weight: 800;
    flex-shrink: 0;
  }
  .unavailable-content { flex: 1; }
  .unavailable-title {
    font-size: 15px; font-weight: 700; color: #fcd34d;
    margin-bottom: 6px;
  }
  .unavailable-text {
    font-size: 13px; line-height: 1.6; color: #d0d0d8;
  }
  .unavailable-actions {
    margin-top: 14px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .unavailable-actions .btn {
    padding: 9px 16px; border-radius: 8px;
    background: var(--card-2); border: 1px solid var(--line);
    color: #e5e5ea; font-size: 12.5px; font-weight: 600;
    transition: .15s;
  }
  .unavailable-actions .btn:hover { background: #2e2e38; border-color: #4a4a58; }

  /* ═══════════ PROVIDER FOOTER ═══════════ */
  .provider-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,13,.98);
    border-top: 1px solid var(--line);
    padding: 12px 20px;
    z-index: 45;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.2,.9,.3,1);
    box-shadow: 0 -12px 40px rgba(0,0,0,.7);
  }
  .provider-footer.show { transform: translateY(0); }
  .provider-footer-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 12.5px;
  }
  .provider-footer-title {
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 800;
    margin-right: auto;
  }
  .provider-footer-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #c3c3cd;
    font-weight: 600;
    white-space: nowrap;
  }
  .provider-footer-item .dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
  }
  .provider-footer-item.loading .dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .provider-footer-item.ok .dot { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,.6); }
  .provider-footer-item.empty .dot { background: #6b7280; }
  .provider-footer-item.error .dot { background: var(--accent); }
  .provider-footer-item-status {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .provider-footer-item.ok .provider-footer-item-status { color: var(--success); }
  .provider-footer-item.error .provider-footer-item-status { color: #fca5a5; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  @media (max-width: 640px) {
    .provider-footer { padding: 10px 14px; }
    .provider-footer-inner { gap: 14px; font-size: 11.5px; }
    .provider-footer-title { font-size: 10px; letter-spacing: 1.1px; }
    .provider-footer-item-status { display: none; }
  }

  /* ═══════════ TRAILER OVERLAY ═══════════ */
  .trailer-overlay {
    position: fixed; inset: 0;
    z-index: 900;
    display: flex; align-items: center; justify-content: center;
    padding: 72px 20px 20px;
    animation: trailerIn .28s ease;
  }
  .trailer-overlay[hidden] { display: none; }
  @keyframes trailerIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .trailer-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .trailer-wrapper {
    position: relative;
    width: 100%;
    max-width: min(1200px, calc((100vh - 140px) * 16 / 9));
    z-index: 1;
  }
  .trailer-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.9);
    animation: trailerZoom .32s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes trailerZoom {
    from { opacity: 0; transform: scale(.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .trailer-frame {
    position: absolute; inset: 0;
  }
  .trailer-frame iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }
  .trailer-close {
    position: absolute;
    top: -56px;
    right: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.25);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    z-index: 2;
    transition: background .15s, transform .15s, border-color .15s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    -webkit-tap-highlight-color: transparent;
  }
  .trailer-close:hover {
    background: rgba(229,9,20,.85);
    border-color: var(--accent);
    transform: scale(1.06);
  }
  .trailer-close:active { transform: scale(.95); }

  @media (max-width: 640px) {
    .trailer-overlay { padding: 60px 0 0; align-items: stretch; }
    .trailer-wrapper { width: 100vw; max-width: 100vw; }
    .trailer-container { aspect-ratio: auto; height: 100%; border-radius: 0; }
    .trailer-close { top: -52px; right: 14px; }
  }

  /* ═══════════ PERSON MODAL ═══════════ */
  .person-modal {
    position: fixed; inset: 0;
    z-index: 900;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .person-modal[hidden] { display: none; }
  .person-modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: personFadeIn .2s ease;
  }
  @keyframes personFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .person-modal-panel {
    position: relative;
    width: min(880px, 100%);

<script>
/* ═══════════ CONFIG ═══════════ */
const QS = new URLSearchParams(location.search);
const PROXY = location.origin;
const BASE = "https://officialmoviebox.com";

const TMDB_API_KEY = "09c7460bdc6319d6538d786919306438";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMG_POSTER = "https://image.tmdb.org/t/p/w500";
const TMDB_IMG_BACKDROP = "https://image.tmdb.org/t/p/w1280";
const TMDB_IMG_PROFILE = "https://image.tmdb.org/t/p/w185";
const TMDB_IMG_CREDIT = "https://image.tmdb.org/t/p/w342";

const HISTORY_KEY = "watchHistory";

const Q = {
  source:     QS.get("source") || "",
  detailPath: QS.get("detailPath") || "",
  subjectId:  QS.get("subjectId") || "",
  url:        QS.get("url") || "",
  title:      QS.get("title") || "",
  tmdbId:     QS.get("tmdbId") || "",
  mediaType:  QS.get("mediaType") || "",
  isSeries:   QS.get("isSeries") === "1" || QS.get("mediaType") === "tv",
  debug:      QS.get("debug") === "1",

if (Q.title) {
  document.title = Q.title + " — Details";
  document.getElementById("pageTitle").textContent = Q.title;
}

/* ═══════════ DEBUG OVERLAY ═══════════ */
if (Q.debug) {
  const _log = console.log.bind(console);
  const _warn = console.warn.bind(console);
  const _err = console.error.bind(console);
  const getEl = () => {
    let el = document.getElementById("debugOutput");
    if (!el) {
      el = document.createElement("pre");
      el.id = "debugOutput";
      document.body.appendChild(el);
    }
    return el;
  };
  const append = (level, args) => {
    const el = getEl();
    const line = "[" + level + "] " + args.map(x =>
      typeof x === "object" ? JSON.stringify(x) : String(x)
    ).join(" ");
    el.textContent = (el.textContent + "\n" + line).trim();
    el.scrollTop = el.scrollHeight;
  };
  console.log   = (...a) => { _log(...a);   append("LOG", a); };
  console.warn  = (...a) => { _warn(...a);  append("WARN", a); };
  console.error = (...a) => { _err(...a);   append("ERR", a); };
  document.body.style.paddingBottom = "40vh";
}

/* ═══════════ SOURCE DETECTION ═══════════ */
function detectSource() {
  if (Q.source === "tmdb" || Q.tmdbId) return "tmdb";
  if (Q.source === "moviebox" || Q.detailPath) return "moviebox";
  if (Q.source === "hdhub") return "hdhub";
  if (Q.source === "drive") return "drive";
  if (Q.url) {
    if (/hdhub4u/i.test(Q.url)) return "hdhub";
    if (/moviesdrive/i.test(Q.url)) return "drive";
    return "external";
  }
  return "";
}

/* ═══════════ STATE ═══════════ */
const state = {
  source: detectSource(),
  hero: {
    title:    Q.title || "",
    poster:   "",
    backdrop: "",
    overview: "",
    year:     "",
    rating:   "",
    runtime:  0,
    genres:   [],
    country:  "",
    isTV:     Q.isSeries,
    tmdbId:   Q.tmdbId,
    tmdbLoaded: false,
    cast:     [],
    trailerKey: "",
  },
  moviebox: { detailPath: Q.detailPath, subjectId: Q.subjectId, data: null,
              status: "idle", error: null, selectedDub: 0, selectedSe: 0, selectedEp: 1 },
  hdhub:    { url: "", streams: [], status: "idle", error: null, selectedServer: 0 },
  drive:    { url: "", streams: [], status: "idle", error: null, selectedServer: 0 },
  activeTab: "",
  bootError: null,
};

/* ═══════════ HELPERS ═══════════ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function imgUrl(v) {
  if (!v) return "";
  if (typeof v === "string") return v.startsWith("//") ? "https:" + v : v;
  return v.url || v.src || v.path || "";
}

/* ═══════════ POSTER / BACKDROP BACKGROUND ═══════════ */
function applyBackground(posterUrl, backdropUrl) {
  const bgEl = document.getElementById("bgBlur");
  if (!bgEl) return;
  const url = backdropUrl || posterUrl;
  if (!url) return;
  if (bgEl.dataset.set === url) return;
  bgEl.dataset.set = url;
  const img = new Image();
  img.onload = () => {
    bgEl.style.backgroundImage = `url('${url}')`;
    bgEl.classList.add("visible");
  };
  img.onerror = () => {};
  img.src = url;
}

/* ═══════════ TITLE NORMALIZATION ═══════════ */
function cleanTitle(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/[×✕✖]/g, " x ")
    .replace(/[‐‑‒–—―]/g, "-")
    .replace(/[\u00A0\u2000-\u200B]/g, " ")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}
function cleanForSearch(s) {
  return String(s || "")
    .replace(/[×✕✖]/g, " x ")
    .replace(/[\u00A0\u2000-\u200B]/g, " ")
    .replace(/\s*\((?:19|20)\d{2}\)\s*/g, " ")
    .replace(/\s*\[\s*[Ss]\d+.*?\]\s*/g, " ")
    .replace(/\s+Season\s+\d+.*$/i, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function matchScore(norm, needle) {
  if (norm === needle) return 100;
  if (norm.startsWith(needle + " ") || norm.endsWith(" " + needle)) return 85;
  if (norm.includes(needle) || needle.includes(norm)) return 65;
  const needleWords = needle.split(" ").filter(w => w.length > 1);
  const normWords   = norm.split(" ").filter(w => w.length > 1);
  if (needleWords.length === 0) return 0;
  const overlap  = needleWords.filter(w => normWords.includes(w)).length;
  const coverage = overlap / needleWords.length;
  if (coverage >= 0.5) return Math.round(40 + coverage * 25);
  return 0;
}

/* ═══════════ WATCH HISTORY ═══════════ */
function saveToHistory(entry) {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    let history = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(history)) history = [];
    const entryKey = entry.tmdbId
      ? "tmdb:" + entry.tmdbId
      : entry.detailPath
        ? "mb:" + entry.detailPath + ":" + (entry.se || "")
        : entry.url
          ? "url:" + entry.url
          : "title:" + entry.title;
    history = history.filter(h => {
      const hKey = h.tmdbId
        ? "tmdb:" + h.tmdbId
        : h.detailPath
          ? "mb:" + h.detailPath + ":" + (h.se || "")
          : h.url
            ? "url:" + h.url
            : "title:" + h.title;
      return hKey !== entryKey;
    });
    history.unshift({ ...entry, watchedAt: Date.now(), entryKey });
    history = history.slice(0, 60);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    console.log("[history] saved: " + entry.title + (entry.se ? " S" + entry.se + "E" + entry.ep : ""));
  } catch (e) {
    console.warn("[history] save failed:", e.message);
  }
}

/* ═══════════ TMDB ═══════════ */
async function tmdbFetch(path, params = {}) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "en-US");
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, String(v));
  }
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error("TMDB " + res.status);
  return res.json();
}

async function fetchTmdbDetails(tmdbId, mediaType) {
  if (!tmdbId) return null;
  try {
    const data = await tmdbFetch(`/${mediaType || "movie"}/${tmdbId}`);
    return {
      tmdbId:   data.id,
      title:    data.title || data.name || "",
      overview: data.overview || "",
      poster:   data.poster_path ? TMDB_IMG_POSTER + data.poster_path : "",
      backdrop: data.backdrop_path ? TMDB_IMG_BACKDROP + data.backdrop_path : "",
      year:     (data.release_date || data.first_air_date || "").slice(0, 4),
      rating:   data.vote_average ? data.vote_average.toFixed(1) : "",
      runtime:  data.runtime || (data.episode_run_time && data.episode_run_time[0]) || 0,
      genres:   (data.genres || []).map(g => g.name),
      isTV:     mediaType === "tv",
      country:  (data.production_countries && data.production_countries[0]?.name) || "",
    };
  } catch (e) {
    console.warn("[tmdb] details failed:", e.message);
    return null;
  }
}

async function fetchTmdbCredits(tmdbId, mediaType) {
  if (!tmdbId) return [];
  try {
    const data = await tmdbFetch(`/${mediaType || "movie"}/${tmdbId}/credits`);
    return (data.cast || []).slice(0, 14).map(c => ({
      id:        c.id,
      name:      c.name || "",
      character: c.character || "",
      profile:   c.profile_path ? TMDB_IMG_PROFILE + c.profile_path : "",
    })).filter(c => c.name);
  } catch (e) {
    console.warn("[tmdb] credits failed:", e.message);
    return [];
  }
}

async function fetchTmdbTrailer(tmdbId, mediaType) {
  if (!tmdbId) return "";
  try {
    const data = await tmdbFetch(`/${mediaType || "movie"}/${tmdbId}/videos`);
    const videos = data.results || [];
    const priority = ["Trailer", "Teaser", "Clip", "Featurette"];
    for (const type of priority) {
      const hit = videos.find(v => v.site === "YouTube" && v.type === type && v.official);
      if (hit) return hit.key;
    }
    for (const type of priority) {
      const hit = videos.find(v => v.site === "YouTube" && v.type === type);
      if (hit) return hit.key;
    }
    const anyYT = videos.find(v => v.site === "YouTube");
    return anyYT ? anyYT.key : "";
  } catch (e) {
    console.warn("[tmdb] videos failed:", e.message);
    return "";
  }
}

async function searchTmdbByTitle(title, isTVHint) {
  if (!title) return null;
  try {
    const data = await tmdbFetch("/search/multi", { query: title, page: 1, include_adult: "false" });
    const results = (data.results || []).filter(r => r.media_type === "movie" || r.media_type === "tv");
    if (!results.length) return null;
    const needle = cleanTitle(title);
    const yearMatch = String(title).match(/\b(19\d{2}|20\d{2})\b/);
    const targetYear = yearMatch ? yearMatch[1] : null;
    let best = null, bestScore = 0;
    for (const r of results) {
      const name = r.title || r.name || "";
      const norm = cleanTitle(name);
      let score = matchScore(norm, needle);
      if (score === 0) continue;
      if (targetYear) {
        const relYear = (r.release_date || r.first_air_date || "").slice(0, 4);
        if (relYear === targetYear) score += 30;
      }
      if (r.popularity > 20) score += 5;
      if (isTVHint !== undefined && r.media_type === (isTVHint ? "tv" : "movie")) score += 5;
      if (score > bestScore) { bestScore = score; best = r; }
    }
    return best && bestScore >= 55
      ? { id: best.id, mediaType: best.media_type, title: best.title || best.name }
      : null;
  } catch (e) {
    console.warn("[tmdb] search failed:", e.message);
    return null;
  }
}

/* ═══════════ NUXT DECODER ═══════════ */
const DEVALUE_WRAPPERS = {
  ShallowReactive: v => v, Reactive: v => v, Ref: v => v,
  ShallowRef: v => v, EmptyRef: () => undefined, EmptyShallowRef: () => undefined,
  Set: v => v, Map: v => v, Date: v => v, RegExp: v => v, BigInt: v => v,
  "null": () => null, "undefined": () => undefined, NaN: () => NaN,
  Infinity: () => Infinity, "-Infinity": () => -Infinity,
};
function devalueResolve(arr) {
  const cache = new Map();
  function go(ref) {
    if (ref === null || ref === undefined) return ref;
    if (typeof ref !== "number") return ref;
    if (cache.has(ref)) return cache.get(ref);
    const v = arr[ref];
    if (v === null || v === undefined || typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
      cache.set(ref, v); return v;
    }
    if (Array.isArray(v)) {
      if (v.length >= 1 && typeof v[0] === "string" && DEVALUE_WRAPPERS[v[0]]) {
        const inner = v.length > 1 ? go(v[1]) : undefined;
        const wrapped = DEVALUE_WRAPPERS[v[0]](inner);
        cache.set(ref, wrapped); return wrapped;
      }
      const out = []; cache.set(ref, out);
      for (const item of v) out.push(go(item));
      return out;
    }
    if (typeof v === "object") {
      const out = {}; cache.set(ref, out);
      for (const k of Object.keys(v)) out[k] = go(v[k]);
      return out;
    }
    cache.set(ref, v); return v;
  }
  return go(0);
}
function extractNuxt3Payload(html) {
  const m = html.match(/<script[^>]*id=["']__NUXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try {
    const arr = JSON.parse(m[1]);
    if (!Array.isArray(arr)) return null;
    return devalueResolve(arr);
  } catch (_) { return null; }
}
function findDetailRoot(root) {
  const visited = new WeakSet(); let found = null;
  function walk(node, depth) {
    if (found || depth > 60 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (node.subject && node.subject.subjectId && (node.resource !== undefined || node.metadata !== undefined)) {
      found = node; return;
    }
    if (Array.isArray(node)) { for (const item of node) { walk(item, depth + 1); if (found) return; } return; }
    for (const k of Object.keys(node)) { walk(node[k], depth + 1); if (found) return; }
  }
  walk(root, 0); return found;
}
function findSubjects(root) {
  const seen = new Set(), out = [], visited = new WeakSet();
  function walk(node, depth) {
    if (depth > 40 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (Array.isArray(node)) { for (const item of node) walk(item, depth + 1); return; }
    if (typeof node.detailPath === "string" && node.detailPath.length > 0 &&
        typeof node.title === "string" && node.title.length > 0 &&
        node.subjectId !== undefined && !seen.has(node.detailPath)) {
      seen.add(node.detailPath);
      out.push({
        title: node.title,
        detailPath: node.detailPath,
        subjectId: String(node.subjectId || ""),
        isTV: Number(node.subjectType) === 2,
        hasResource: node.hasResource !== false,
      });
    }
    for (const k of Object.keys(node)) walk(node[k], depth + 1);
  }
  walk(root, 0);
  return out.filter(s => s.hasResource);
}
function normalizeSeasons(rawSeasons, isSeries) {
  if (!Array.isArray(rawSeasons) || !rawSeasons.length) {
    return [{ se: 0, title: "Movie", episodes: [{ ep: 1 }] }];
  }
  const out = [];
  for (const s of rawSeasons) {
    const se = Number(s.se ?? (isSeries ? 1 : 0));
    const resList = Array.isArray(s.resolutions) ? s.resolutions : [];
    let eps = [];
    if (s.allEp) eps = String(s.allEp).split(",").map(n => Number(n.trim())).filter(n => n > 0);
    else if (s.maxEp) eps = Array.from({ length: Number(s.maxEp) }, (_, i) => i + 1);
    if (!eps.length && resList.length) eps = [...new Set(resList.map(r => Number(r.epNum) || 1))].sort((a, b) => a - b);
    if (!eps.length) eps = [1];
    out.push({
      se: isSeries ? (se || 1) : 0,
      title: s.title || (isSeries ? "Season " + (se || 1) : "Movie"),
      episodes: eps.map(ep => ({ ep })),
    });
  }
  return out;
}

/* ═══════════ SEARCH: MovieBox ═══════════ */
async function searchMovieBox(title, isTV) {
  if (!title) return null;
  const cleaned = cleanForSearch(title);
  if (!cleaned) return null;
  const queries = [
    cleaned,
    cleaned.replace(/\b(the|a|an)\b/gi, " ").replace(/\s+/g, " ").trim(),
    cleaned.split(" ").slice(0, 3).join(" "),
  ].filter((q, i, arr) => q && arr.indexOf(q) === i);
  console.log("[match] MovieBox searching: " + JSON.stringify(queries));
  for (const q of queries) {
    const result = await tryMovieBoxQuery(q, isTV);
    if (result) return result;
  }
  return null;
}
async function tryMovieBoxQuery(query, isTV) {
  const endpoints = [
    "/search?q=" + encodeURIComponent(query),
    "/newWeb/searchResult?keyword=" + encodeURIComponent(query),
  ];
  for (const ep of endpoints) {
    const result = await tryMovieBoxEndpoint(ep, query, isTV);
    if (result) return result;
  }
  return null;
}
async function tryMovieBoxEndpoint(endpoint, query, isTV) {
  try {
    const fullUrl = BASE + endpoint;
    const res = await fetch(PROXY + "/?url=" + encodeURIComponent(fullUrl) + "&referer=" + encodeURIComponent(BASE + "/"));
    if (!res.ok) return null;
    const resolved = extractNuxt3Payload(await res.text());
    if (!resolved) return null;
    const subjects = findSubjects(resolved);
    const endpointName = endpoint.split("?")[0];
    if (subjects.length === 0) {
      console.log("[match] MovieBox '" + query + "' via " + endpointName + " → 0 results");
      return null;
    }
    const needle = cleanTitle(query);
    const scored = [];
    for (const s of subjects) {
      if (isTV !== undefined && s.isTV !== isTV) continue;
      const norm = cleanTitle(s.title);
      const score = matchScore(norm, needle);
      if (score > 0) scored.push({ subject: s, score, norm });
    }
    scored.sort((a, b) => b.score - a.score);
    const best = scored[0];
    console.log("[match] MovieBox '" + query + "' via " + endpointName +
                " → " + subjects.length + " results, best: '" +
                (best?.subject.title || "none") + "' score=" + (best?.score || 0));
    if (best && best.score >= 45) return best.subject;
  } catch (e) {
    console.warn("[match] endpoint error:", e.message);
  }
  return null;
}

/* ═══════════ SEARCH: hdhub / drive ═══════════ */
async function searchProvider(pid, title) {
  if (!title) return null;
  const cleaned = cleanForSearch(title);
  if (!cleaned) return null;
  try {
    const res = await fetch(PROXY + "/providers/" + pid + "/search?q=" + encodeURIComponent(cleaned));
    if (!res.ok) return null;
    const data = await res.json();
    const results = data.results || [];
    if (results.length === 0) {
      console.log("[match] " + pid + " '" + cleaned + "' → 0 results");
      return null;
    }
    const needle = cleanTitle(cleaned);
    const scored = [];
    for (const r of results) {
      const norm = cleanTitle(r.title);
      const score = matchScore(norm, needle);
      if (score > 0) scored.push({ result: r, score, norm });
    }
    scored.sort((a, b) => b.score - a.score);
    const best = scored[0];
    console.log("[match] " + pid + " '" + cleaned + "' → " + results.length +
                " results, best: '" + (best?.result.title || "none") +
                "' score=" + (best?.score || 0));
    if (best && best.score >= 45) return best.result.url;
  } catch (e) {
    console.warn("[match] " + pid + " error:", e.message);
  }
  return null;
}

/* ═══════════ PROVIDER LOADERS ═══════════ */
async function loadMovieBox(detailPath, subjectId) {
  state.moviebox.status = "loading";
  state.moviebox.detailPath = detailPath;
  state.moviebox.subjectId = subjectId || "";
  render();

  try {
    const realUrl = BASE + "/moviesDetail/" + detailPath;
    const res = await fetch(PROXY + "/?url=" + encodeURIComponent(realUrl) + "&referer=" + encodeURIComponent(BASE + "/"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const html = await res.text();
    const resolved = extractNuxt3Payload(html);
    if (!resolved) throw new Error("No Nuxt payload");
    const detail = findDetailRoot(resolved);
    if (!detail) throw new Error("No subject");

    const subject = detail.subject;
    const resource = detail.resource || {};
    const isSeries = Number(subject.subjectType) === 2;

    state.moviebox.data = {
      subjectId: String(subject.subjectId || subjectId || ""),
      detailPath: subject.detailPath || detailPath,
      title: subject.title || "",
      description: subject.description || "",
      cover: imgUrl(subject.cover),
      isSeries,
      dubs: (Array.isArray(subject.dubs) ? subject.dubs : []).filter(d => d && d.subjectId),
      seasons: normalizeSeasons(resource.seasons || [], isSeries),
    };
    state.moviebox.selectedSe = state.moviebox.data.seasons[0]?.se ?? 0;
    state.moviebox.selectedEp = state.moviebox.data.seasons[0]?.episodes?.[0]?.ep ?? 1;
    state.moviebox.status = "ok";

    if (state.hero.title === Q.title || !state.hero.title) {
      state.hero.title = state.moviebox.data.title;
      if (!state.hero.poster && state.moviebox.data.cover) state.hero.poster = state.moviebox.data.cover;
      if (!state.hero.overview && state.moviebox.data.description) state.hero.overview = state.moviebox.data.description;
    }
    console.log("[moviebox] loaded: '" + state.moviebox.data.title + "'");
  } catch (e) {
    console.warn("[moviebox]", e);
    state.moviebox.error = e.message;
    state.moviebox.status = "error";
  }
  render();
}

async function loadExternal(source, url) {
  if (!url) { state[source].status = "empty"; return; }
  state[source].url = url;
  state[source].status = "loading";
  render();

  const referer = source === "hdhub" ? "https://new8.hdhub4u.cl/" : "https://new3.moviesdrive.beer/";
  try {
    const res = await fetch(PROXY + "/?url=" + encodeURIComponent(url) + "&referer=" + encodeURIComponent(referer) + "&provider=" + source);
    if (res.ok) {
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const ogTitle = doc.querySelector('meta[property="og:title"]')?.content
        || doc.querySelector("h1.entry-title, h1.page-title, h1")?.textContent || "";
      const ogImage = doc.querySelector('meta[property="og:image"]')?.content || "";
      const ogDesc = doc.querySelector('meta[property="og:description"]')?.content || "";
      if (ogTitle && (!state.hero.title || state.hero.title === Q.title || state.hero.title === "Loading…")) {
        state.hero.title = ogTitle.trim();
      }
      if (ogImage && !state.hero.poster) state.hero.poster = ogImage;
      if (ogDesc && !state.hero.overview) state.hero.overview = ogDesc;
      if (/\(Season\s*\d|S\d{2}E\d{2}|Complete\s*Series|Web\s*Series/i.test(ogTitle)) {
        state.hero.isTV = true;
      }
    }
  } catch (e) { console.warn("[ext meta " + source + "]", e); }

  try {
    const res = await fetch(PROXY + "/providers/" + source + "/streams?url=" + encodeURIComponent(url));
    if (res.ok) {
      const data = await res.json();
      state[source].streams = (data.streams || []).filter(s => s.url);
      state[source].status = state[source].streams.length ? "ok" : "empty";
      console.log("[" + source + "] streams: " + state[source].streams.length);
    } else {
      state[source].status = "empty";
    }
  } catch (e) {
    console.warn("[ext streams " + source + "]", e);
    state[source].error = e.message;
    state[source].status = "error";
  }
  render();
}

async function enrichHeroWithTmdb() {
  if (state.hero.tmdbLoaded) return;
  let meta = null;
  let mediaType = Q.mediaType || (state.hero.isTV ? "tv" : "movie");

  if (Q.tmdbId) {
    meta = await fetchTmdbDetails(Q.tmdbId, mediaType);
  }
  if (!meta && state.hero.title && state.hero.title !== "Loading…") {
    const match = await searchTmdbByTitle(cleanForSearch(state.hero.title), state.hero.isTV);
    if (match) {
      meta = await fetchTmdbDetails(match.id, match.mediaType);
      mediaType = match.mediaType;
    }
  }
  if (meta) {
    state.hero = {
      title:    meta.title || state.hero.title,
      poster:   meta.poster || state.hero.poster,
      backdrop: meta.backdrop || state.hero.backdrop,
      overview: meta.overview || state.hero.overview,
      year:     meta.year || state.hero.year,
      rating:   meta.rating || state.hero.rating,
      runtime:  meta.runtime || state.hero.runtime,
      genres:   meta.genres || state.hero.genres,
      country:  meta.country || state.hero.country,
      isTV:     meta.isTV !== undefined ? meta.isTV : state.hero.isTV,
      tmdbId:   meta.tmdbId || state.hero.tmdbId,
      tmdbLoaded: true,
      cast:     state.hero.cast || [],
      trailerKey: state.hero.trailerKey || "",
    };

    const [cast, trailerKey] = await Promise.all([
      fetchTmdbCredits(meta.tmdbId, mediaType),
      fetchTmdbTrailer(meta.tmdbId, mediaType),
    ]);
    if (cast.length) state.hero.cast = cast;
    if (trailerKey) state.hero.trailerKey = trailerKey;

    document.title = (state.hero.title || "Details") + " — Details";
    document.getElementById("pageTitle").textContent = state.hero.title || "Details";
    render();
  }
}

const personCache = new Map();

async function fetchPersonDetails(personId) {
  const url = new URL(TMDB_BASE + `/person/${personId}`);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "en-US");
  url.searchParams.set("append_to_response", "combined_credits");
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error("TMDB " + res.status);
  return await res.json();
}

function collectPersonCredits(data) {
  const cast = (data.combined_credits?.cast || []).map(c => ({
    mediaType: c.media_type,
    id: c.id,
    title: c.title || c.name || "",
    poster: c.poster_path ? (TMDB_IMG_CREDIT + c.poster_path) : "",
    year: String(c.release_date || c.first_air_date || "").slice(0, 4),
    role: c.character || "Cast",
    popularity: c.popularity || 0,
    isCast: true,
  }));
  const crew = (data.combined_credits?.crew || []).map(c => ({
    mediaType: c.media_type,
    id: c.id,
    title: c.title || c.name || "",
    poster: c.poster_path ? (TMDB_IMG_CREDIT + c.poster_path) : "",
    year: String(c.release_date || c.first_air_date || "").slice(0, 4),
    role: c.job || "Crew",
    popularity: c.popularity || 0,
    isCast: false,
  }));
  const seen = new Map();
  for (const c of [...cast, ...crew]) {
    const k = c.mediaType + ":" + c.id;
    const ex = seen.get(k);
    if (!ex) { seen.set(k, c); continue; }
    if (c.isCast && !ex.isCast) seen.set(k, c);
    else if (c.isCast === ex.isCast && c.popularity > ex.popularity) seen.set(k, c);
  }
  return [...seen.values()]
    .filter(c => c.poster && c.title)
    .sort((a, b) => b.popularity - a.popularity);
}

    const actorNameAttr = ` data-actor-name="${escapeHtml(c.name)}"`;
    return `
      <div class="cast-card"${actorIdAttr}${actorNameAttr} role="button" tabindex="0">
        ${img}
        <div class="cast-name">${escapeHtml(c.name)}</div>
        ${c.character ? `<div class="cast-role">${escapeHtml(c.character)}</div>` : ''}
      </div>
    `;
  }).join("");
  return `
    <div class="cast-section">
      <div class="section-title">Cast</div>
      <div class="cast-scroller">${cards}</div>
    </div>
  `;
}

function renderTabs(providers) {
  const labels = { moviebox: "MovieBox", hdhub: "hdhub4u", drive: "moviesDrive" };
  return `<nav class="tabs">${providers.map(id => {
    const isActive = id === state.activeTab;
    return `<button class="tab ${isActive ? "active" : ""}" data-tab="${id}">${escapeHtml(labels[id])}</button>`;
  }).join("")}</nav>`;
}

function renderMovieBoxTab() {
  const m = state.moviebox;
  if (!m.data) return `<div class="loading-block"><div class="spinner"></div><div>Loading…</div></div>`;

  const d = m.data;
  const parts = [];

  if (d.dubs.length >= 1) {
    parts.push(`<div class="section"><div class="section-title">Audio</div><div class="pills">
      ${d.dubs.map((dub, i) => `
        <button class="pill ${i === m.selectedDub ? "active" : ""}" data-action="pick-dub" data-dub="${i}">
          ${escapeHtml(dub.lanName || dub.lan || "Audio " + (i + 1))}
        </button>`).join("")}
    </div></div>`);
  }

  if (d.isSeries && d.seasons.length > 0) {
    const season = d.seasons.find(s => s.se === m.selectedSe) || d.seasons[0];
    const seasonRow = d.seasons.length > 1 ? `
      <div class="season-row">
        <label>Season</label>
        <select class="season-select" id="seasonSelect">
          ${d.seasons.map(s => `<option value="${s.se}" ${s.se === m.selectedSe ? "selected" : ""}>${escapeHtml(s.title)}</option>`).join("")}
        </select>
      </div>` : "";

    const epGrid = `<div class="episodes-grid">
      ${season.episodes.map(e => {
        const isActive = season.se === m.selectedSe && e.ep === m.selectedEp;
        return `<button class="ep-btn ${isActive ? "active" : ""}" data-action="pick-ep" data-se="${season.se}" data-ep="${e.ep}">
          E${String(e.ep).padStart(2, "0")}
        </button>`;
      }).join("")}
    </div>`;

    parts.push(`<div class="section"><div class="section-title">Episodes</div>${seasonRow}${epGrid}</div>`);
  }

  const playText = d.isSeries
    ? `Play S${m.selectedSe}E${String(m.selectedEp).padStart(2, "0")}`
    : "Play Movie";
  parts.push(`<div class="play-row">
    <button class="btn btn-primary" data-action="play-moviebox" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      ${playText}
    </button>
    ${trailerBtnHtml()}
  </div>`);

  return parts.join("");
}

function renderServerTab(provider) {
  const s = state[provider];
  if (!s.streams.length) return `<div class="loading-block">No streams</div>`;
  return `
    <div class="section"><div class="section-title">Server</div><div class="pills">
      ${s.streams.map((st, i) => `
        <button class="pill ${i === s.selectedServer ? "active" : ""}" data-action="pick-server" data-provider="${provider}" data-server="${i}">
          ${escapeHtml(st.label || ("Server " + (i + 1)))}
          ${st.quality && st.quality !== "Auto" ? " · " + escapeHtml(st.quality) : ""}
        </button>`).join("")}
    </div></div>
    <div class="play-row">
      <button class="btn btn-primary" data-action="play-server" data-provider="${provider}" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
      ${trailerBtnHtml()}
    </div>`;
}

function updateProviderFooter() {
  const footer = document.getElementById("providerFooter");
  const inner = document.getElementById("providerFooterInner");
  if (!footer || !inner) return;

  const allTried = getAllTried();
  if (allTried) {
    footer.classList.remove("show");
    document.body.classList.remove("has-footer");
    return;
  }

  const providers = [
    { id: "moviebox", name: "MovieBox" },
    { id: "hdhub",    name: "hdhub4u" },
    { id: "drive",    name: "moviesDrive" },
  ];

  const items = providers.map(p => {
    const s = state[p.id];
    let cls = "loading", text = "Checking";
    if (s.status === "ok") { cls = "ok"; text = "Available"; }
    else if (s.status === "empty") { cls = "empty"; text = "Not found"; }
    else if (s.status === "error") { cls = "error"; text = "Error"; }
    else if (s.status === "idle") { cls = "loading"; text = "Waiting"; }
    return `
      <div class="provider-footer-item ${cls}">
        <span class="dot"></span>
        <span>${escapeHtml(p.name)}</span>
        <span class="provider-footer-item-status">${text}</span>
      </div>
    `;
  }).join("");

  inner.innerHTML =
    '<div class="provider-footer-title">Checking availability</div>' + items;

  footer.classList.add("show");
  document.body.classList.add("has-footer");
}

function render() {
  const main = document.getElementById("main");
  const available = getAvailableProviders();
  const allTried = getAllTried();

  if (state.hero.title) {
    document.getElementById("pageTitle").textContent = state.hero.title;
    document.title = state.hero.title + " — Details";
  }

  if (state.hero.backdrop) applyBackground(state.hero.poster, state.hero.backdrop);
  else if (state.hero.poster) applyBackground(state.hero.poster);

  if (!state.activeTab || !available.includes(state.activeTab)) {
    if (available.length > 0) {
      if (state.source && available.includes(state.source)) state.activeTab = state.source;
      else state.activeTab = available[0];
    }
  }

  const parts = [];
  parts.push(renderHero());
  const castHtml = renderCastSection();
  if (castHtml) parts.push(castHtml);

  if (state.bootError) {
    parts.push(`
      <div class="unavailable-banner">
        <div class="unavailable-icon">⚠</div>
        <div class="unavailable-content">
          <div class="unavailable-title">${escapeHtml(state.bootError)}</div>
          <div class="unavailable-text">Open this page from the catalog, or try again.</div>
          <div class="unavailable-actions">
            <button class="btn" onclick="location.href='index.html'">Back to catalog</button>
          </div>
        </div>
      </div>
    `);
  } else if (available.length > 0) {
    parts.push(renderTabs(available));
    for (const id of available) {
      const isActive = id === state.activeTab;
      const content = id === "moviebox" ? renderMovieBoxTab() : renderServerTab(id);
      parts.push(`<div class="tab-content ${isActive ? "active" : ""}" data-tab-content="${id}">${content}</div>`);
    }
  } else if (allTried) {
    parts.push(`
      <div class="unavailable-banner">
        <div class="unavailable-icon">⚠</div>
        <div class="unavailable-content">
          <div class="unavailable-title">No streams available</div>
          <div class="unavailable-text">
            We checked MovieBox, hdhub4u, and moviesDrive — this title isn't currently available on any provider.
            Try a different title, or check back later.
          </div>
          <div class="unavailable-actions">
            <button class="btn" id="retryAll">Retry all providers</button>
            <button class="btn" onclick="location.href='index.html'">Back to catalog</button>
          </div>
        </div>
      </div>
    `);
  }

  main.innerHTML = parts.join("");
  bindEvents();
  updateProviderFooter();
}

function bindEvents() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.activeTab = tab.dataset.tab;
      render();
    });
  });

  const seasonSelect = document.getElementById("seasonSelect");
  if (seasonSelect) seasonSelect.addEventListener("change", (e) => {
    const se = Number(e.target.value);
    state.moviebox.selectedSe = se;
    const season = state.moviebox.data.seasons.find(s => s.se === se);
    state.moviebox.selectedEp = season?.episodes?.[0]?.ep || 1;
    render();
  });

  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.action;
      if (a === "pick-dub") {
        state.moviebox.selectedDub = Number(btn.dataset.dub);
        render();
      } else if (a === "pick-ep") {
        state.moviebox.selectedSe = Number(btn.dataset.se);
        state.moviebox.selectedEp = Number(btn.dataset.ep);
        playMovieBox();
      } else if (a === "pick-server") {
        const p = btn.dataset.provider;
        state[p].selectedServer = Number(btn.dataset.server);
        render();
      } else if (a === "play-moviebox") {
        playMovieBox();
      } else if (a === "play-server") {
        playServer(btn.dataset.provider);
      } else if (a === "play-trailer") {
        openTrailer();
      }
    });
  });

  const retryAll = document.getElementById("retryAll");
  if (retryAll) retryAll.addEventListener("click", () => boot(true));

  // Cast cards → open person modal
  document.querySelectorAll(".cast-card[data-actor-id]").forEach(card => {
    const open = () => {
      const id = card.dataset.actorId;
      if (id) openPersonModal(id);
    };
    card.addEventListener("click", open);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        open();
      }
    });
  });
}

/* ═══════════ PLAY ═══════════ */
function playMovieBox() {
  const m = state.moviebox;
  if (!m.data) return;
  const dub = m.data.dubs[m.selectedDub] || {
    subjectId: m.data.subjectId, detailPath: m.data.detailPath, lanName: "Original Audio",
  };

  saveToHistory({
    title: state.hero.title || m.data.title,
    poster: state.hero.poster || m.data.cover,
    backdrop: state.hero.backdrop,
    overview: state.hero.overview || m.data.description,
    year: state.hero.year,
    rating: state.hero.rating,
    isTV: m.data.isSeries,
    tmdbId: state.hero.tmdbId,
    detailPath: dub.detailPath || m.data.detailPath,
    subjectId: dub.subjectId || m.data.subjectId,
    se: m.data.isSeries ? m.selectedSe : null,
    ep: m.data.isSeries ? m.selectedEp : null,
    kind: "moviebox",
  });

  const params = new URLSearchParams({
    detailPath: dub.detailPath || m.data.detailPath,
    mainDetailPath: m.data.detailPath,
    subjectId: dub.subjectId || m.data.subjectId,
    isSeries: m.data.isSeries ? "1" : "0",
    title: state.hero.title || m.data.title,
    subtitle: "",
    lang: dub.lanName || "Original Audio",
  });
  if (m.data.isSeries) {
    params.set("se", String(m.selectedSe || m.data.seasons[0]?.se || 1));
    params.set("ep", String(m.selectedEp || 1));
  }
  location.href = "player.html?" + params.toString();
}

function playServer(provider) {
  const s = state[provider];
  const stream = s.streams[s.selectedServer] || s.streams[0];
  if (!stream?.url) return;

  saveToHistory({
    title: state.hero.title || "Untitled",
    poster: state.hero.poster,
    backdrop: state.hero.backdrop,
    overview: state.hero.overview,
    year: state.hero.year,
    rating: state.hero.rating,
    isTV: state.hero.isTV,
    tmdbId: state.hero.tmdbId,
    url: stream.url,
    provider: provider,
    kind: "external",
  });

  const referer = provider === "hdhub" ? "https://new8.hdhub4u.cl/" : "https://new3.moviesdrive.beer/";
  const proxied = PROXY + "/?url=" + encodeURIComponent(stream.url)
                + "&referer=" + encodeURIComponent(referer)
                + "&provider=" + provider;
  const title = state.hero.title || "Untitled";
  const subtitle = (stream.label || "") + (stream.quality && stream.quality !== "Auto" ? " · " + stream.quality : "");
  const params = new URLSearchParams({ streamUrl: proxied, title, subtitle });
  location.href = "player.html?" + params.toString();
}

/* ═══════════ BOOT DISPATCHER ═══════════ */
async function boot(retry = false) {
  if (retry) {
    state.moviebox = { ...state.moviebox, data: null, status: "idle", error: null };
    state.hdhub   = { ...state.hdhub,   streams: [], status: "idle", error: null, url: "" };
    state.drive   = { ...state.drive,   streams: [], status: "idle", error: null, url: "" };
    state.activeTab = "";
    state.bootError = null;
  }

  document.getElementById("pageTitle").textContent = state.hero.title || "Details";
  render();

  const source = state.source;
  if (source === "tmdb") {
    await bootFromTmdb();
  } else if (source === "moviebox") {
    await bootFromMovieBox();
  } else if (source === "hdhub" || source === "drive") {
    await bootFromExternal(source);
  } else if (source === "external") {
    if (/hdhub4u/i.test(Q.url)) await bootFromExternal("hdhub");
    else if (/moviesdrive/i.test(Q.url)) await bootFromExternal("drive");
    else state.bootError = "Cannot determine source";
  } else {
    state.bootError = "No source specified";
  }

  render();
}

async function bootFromTmdb() {
  let mediaType = Q.mediaType || "movie";
  if (Q.tmdbId) {
    const meta = await fetchTmdbDetails(Q.tmdbId, mediaType);
    if (meta) {
      mediaType = meta.isTV ? "tv" : "movie";
      state.hero = {
        title:    meta.title || state.hero.title,
        poster:   meta.poster || state.hero.poster,
        backdrop: meta.backdrop || state.hero.backdrop,
        overview: meta.overview || state.hero.overview,
        year:     meta.year,
        rating:   meta.rating,
        runtime:  meta.runtime,
        genres:   meta.genres,
        country:  meta.country,
        isTV:     meta.isTV,
        tmdbId:   meta.tmdbId,
        tmdbLoaded: true,
        cast:     [],
        trailerKey: "",
      };

      Promise.all([
        fetchTmdbCredits(meta.tmdbId, mediaType),
        fetchTmdbTrailer(meta.tmdbId, mediaType),
      ]).then(([cast, trailerKey]) => {
        if (cast.length) state.hero.cast = cast;
        if (trailerKey) state.hero.trailerKey = trailerKey;
        render();
      });
      render();
    }
  }

  const searchTitle = cleanForSearch(state.hero.title);
  if (!searchTitle) {
    state.moviebox.status = state.hdhub.status = state.drive.status = "empty";
    render();
    return;
  }

  state.moviebox.status = state.hdhub.status = state.drive.status = "loading";
  render();

  const [mbMatch, hdUrl, drUrl] = await Promise.all([
    searchMovieBox(searchTitle, state.hero.isTV),
    searchProvider("hdhub", searchTitle),
    searchProvider("drive", searchTitle),
  ]);

  await Promise.all([
    (async () => {
      if (mbMatch) await loadMovieBox(mbMatch.detailPath, mbMatch.subjectId);
      else { state.moviebox.status = "empty"; render(); }
    })(),
    (async () => {
      if (hdUrl) await loadExternal("hdhub", hdUrl);
      else { state.hdhub.status = "empty"; render(); }
    })(),
    (async () => {
      if (drUrl) await loadExternal("drive", drUrl);
      else { state.drive.status = "empty"; render(); }
    })(),
  ]);
}

async function bootFromMovieBox() {
  if (!Q.detailPath) {
    state.bootError = "Missing detailPath";
    return;
  }
  state.moviebox.status = "loading";
  render();
  await loadMovieBox(Q.detailPath, Q.subjectId);

  const title = cleanForSearch(state.moviebox.data?.title || state.hero.title);
  if (!title) {
    state.hdhub.status = state.drive.status = "empty";
    render();
    return;
  }
  state.hdhub.status = state.drive.status = "loading";
  render();

  const [hdUrl, drUrl] = await Promise.all([
    searchProvider("hdhub", title),
    searchProvider("drive", title),
  ]);

  await Promise.all([
    (async () => {
      if (hdUrl) await loadExternal("hdhub", hdUrl);
      else { state.hdhub.status = "empty"; render(); }
    })(),
    (async () => {
      if (drUrl) await loadExternal("drive", drUrl);
      else { state.drive.status = "empty"; render(); }
    })(),
  ]);
  enrichHeroWithTmdb();
}

async function bootFromExternal(source) {
  if (!Q.url) {
    state.bootError = "Missing url";
    return;
  }
  state[source].status = "loading";
  render();
  await loadExternal(source, Q.url);
  await enrichHeroWithTmdb();

  const title = cleanForSearch(state.hero.title);
  if (!title) {
    if (source !== "moviebox") state.moviebox.status = "empty";
    if (source !== "hdhub")   state.hdhub.status = "empty";
    if (source !== "drive")   state.drive.status = "empty";
    render();
    return;
  }

  if (source !== "moviebox") state.moviebox.status = "loading";
  if (source !== "hdhub")   state.hdhub.status = "loading";
  if (source !== "drive")   state.drive.status = "loading";
  render();

  const [mbMatch, hdUrl, drUrl] = await Promise.all([
    source !== "moviebox" ? searchMovieBox(title, state.hero.isTV) : Promise.resolve(null),
    source !== "hdhub"    ? searchProvider("hdhub", title) : Promise.resolve(null),
    source !== "drive"    ? searchProvider("drive", title) : Promise.resolve(null),
  ]);

  await Promise.all([
    (async () => {
      if (source === "moviebox") return;
      if (mbMatch) await loadMovieBox(mbMatch.detailPath, mbMatch.subjectId);
      else { state.moviebox.status = "empty"; render(); }
    })(),
    (async () => {
      if (source === "hdhub") return;
      if (hdUrl) await loadExternal("hdhub", hdUrl);
      else { state.hdhub.status = "empty"; render(); }
    })(),
    (async () => {
      if (source === "drive") return;
      if (drUrl) await loadExternal("drive", drUrl);
      else { state.drive.status = "empty"; render(); }
    })(),
  ]);
}

/* ═══════════ INIT ═══════════ */
document.getElementById("backBtn").addEventListener("click", () => {
  if (history.length > 1) history.back();
  else location.href = "index.html";
});

boot();
</script>
