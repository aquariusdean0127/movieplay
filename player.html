<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Playing…</title>
<script src='//libtl.com/sdk.js' data-zone='10973078' data-sdk='show_10973078'></script>
<style>
  :root {
    --accent:#e50914; --accent-2:#f6121d; --line:#2a2a33;
    --card:#1e1e25; --card-2:#26262f; --text:#f5f5f7; --muted:#8a8a94;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#000; }
  body { color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; }
  img { display:block; }

  .player { position:fixed; inset:0; background:#000; }
  .player-stage { position:absolute; inset:0; overflow:hidden; background:#000; }
  .player video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }

  .player-ui {
    position:absolute; inset:0;
    transition:opacity .25s ease;
    user-select:none;
    pointer-events:none;
  }
  .player-ui > * { pointer-events:auto; }
  .player-ui.idle { opacity:0; pointer-events:none; cursor:none; }
  .player-ui.idle > * { pointer-events:none; }

  body.drawer-open .player-ui { transition:none !important; }

  .player-feedback {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:14px 22px; border-radius:14px;
    background:rgba(0,0,0,.7); color:#fff; font-size:20px; font-weight:700;
    pointer-events:none; opacity:0; transition:opacity .18s; z-index:5;
    backdrop-filter:blur(8px);
  }
  .player-feedback.show { opacity:1; }

  .frame-nav-btn {
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:56px; height:56px; border-radius:50%;
    background:rgba(0,0,0,.55);
    border:2px solid rgba(255,255,255,.35);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .1s, border-color .15s;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    -webkit-tap-highlight-color:transparent;
    z-index:3;
  }
  .frame-nav-btn:hover { background:rgba(0,0,0,.78); border-color:var(--accent); }
  .frame-nav-btn:active { transform:translateY(-50%) scale(.92); }
  .frame-nav-btn svg { width:26px; height:26px; fill:currentColor; }
  .frame-nav-btn .nav-label {
    position:absolute; bottom:-28px; left:50%; transform:translateX(-50%);
    font-size:10.5px; font-weight:700; color:#fff; white-space:nowrap;
    background:rgba(0,0,0,.75); padding:2px 8px; border-radius:6px;
    border:1px solid rgba(255,255,255,.15);
  }
  .frame-nav-btn.prev { left:20px; }
  .frame-nav-btn.next { right:20px; }
  .frame-nav-btn[hidden] { display:none; }

  .center-controls {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    gap:20px;
    z-index:2;
  }

  .frame-seek-btn {
    position:relative;
    width:56px; height:56px; border-radius:50%;
    background:rgba(0,0,0,.5);
    border:2px solid rgba(255,255,255,.5);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .1s, border-color .15s;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    -webkit-tap-highlight-color:transparent;
  }
  .frame-seek-btn:hover { background:rgba(0,0,0,.72); border-color:var(--accent); }
  .frame-seek-btn:active { transform:scale(.92); }
  .frame-seek-btn svg { width:22px; height:22px; fill:currentColor; }
  .frame-seek-btn .seek-label {
    position:absolute;
    bottom:7px;
    left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:900;
    color:#fff;
    text-shadow:0 0 2px rgba(0,0,0,.9);
    letter-spacing:-0.2px;
    pointer-events:none;
    line-height:1;
  }

  .player-bigplay {
    width:84px; height:84px; border-radius:50%;
    background:rgba(0,0,0,.5);
    border:2px solid rgba(255,255,255,.7);
    color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
    -webkit-tap-highlight-color:transparent;
    transition:background .18s, transform .15s;
  }
  .player-bigplay:hover { background:var(--accent); border-color:var(--accent); transform:scale(1.06); }
  .player-bigplay:active { transform:scale(.96); }
  .player-bigplay svg { width:34px; height:34px; fill:#fff; }
  .player-bigplay.is-play svg { margin-left: 3px; }

  .caption-overlay {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:8%; max-width:90%; text-align:center;
    pointer-events:none; z-index:3; transition:bottom .18s ease;
    font-size:16px;
  }
  .caption-overlay[hidden] { display:none; }
  .cap-line {
    display:table;
    margin:0 auto 2px;
    padding:3px 10px;
    border-radius:4px;
    white-space:pre-wrap;
    line-height:1.35;
    text-align:center;
    font-family: var(--cap-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    font-size: var(--cap-font-size, 1.2em);
    font-weight: var(--cap-font-weight, 400);
    color: var(--cap-text-color, #ffffff);
    background: var(--cap-bg-color, rgba(0,0,0,0.5));
    text-shadow: var(--cap-text-shadow, 0 1px 3px rgba(0,0,0,0.9));
  }
  body.drawer-open .caption-overlay { visibility:hidden; }

  .player-top {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:10px;
    padding:18px 22px 60px;
    background:linear-gradient(180deg, rgba(0,0,0,.85), transparent);
    pointer-events:none;
  }
  .player-top > * { pointer-events:auto; }
  .player-titles { min-width:0; flex:1; }
  .player-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-sub { font-size:12.5px; color:#b7b7c2; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .icon-btn {
    width:42px; height:42px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    color:#fff; border-radius:10px; cursor:pointer;
    transition:.15s; backdrop-filter:blur(6px);
    -webkit-tap-highlight-color:transparent;
  }
  .icon-btn:hover { background:rgba(255,255,255,.20); }
  .icon-btn:active { transform:scale(.94); }
  .icon-btn svg { width:20px; height:20px; fill:currentColor; }
  .icon-btn.small { width:36px; height:36px; }
  .icon-btn.small svg { width:17px; height:17px; }

  .menu-wrap { position:relative; flex:none; }
  .menu-btn {
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
    color:#fff; border-radius:10px; padding:10px 14px;
    font-size:13px; font-weight:700;
    cursor:pointer; backdrop-filter:blur(6px);
    white-space:nowrap; max-width:180px;
    -webkit-tap-highlight-color:transparent;
  }
  .menu-btn[hidden] { display:none; }
  .menu-btn .label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .menu-btn .chev { width:11px; height:11px; fill:currentColor; opacity:.7; flex-shrink:0; transition:transform .18s; }
  .menu-btn.open .chev { transform:rotate(180deg); }

  .menu-list {
    position:absolute; top:calc(100% + 6px); right:0;
    min-width:160px; max-height:60vh; overflow-y:auto;
    background:rgba(20,20,24,.95);
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px; padding:5px;
    z-index:20; backdrop-filter:blur(14px);
  }
  .menu-list[hidden] { display:none; }
  .menu-list button {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; background:transparent; border:none;
    color:#e5e5ea; padding:9px 12px; border-radius:8px;
    text-align:left; font-size:13px; font-weight:600; cursor:pointer;
  }
  .menu-list button:hover { background:rgba(255,255,255,.08); }
  .menu-list button.active { background:var(--accent); color:#fff; }
  .menu-list button .check { font-size:11px; opacity:0; flex-shrink:0; }
  .menu-list button.active .check { opacity:1; }

  .player-bottom {
    position:absolute; left:0; right:0; bottom:0;
    padding:60px 22px 20px;
    background:linear-gradient(0deg, rgba(0,0,0,.88), transparent);
    pointer-events:none;
  }
  .player-bottom > * { pointer-events:auto; }

  .seek { position:relative; height:22px; display:flex; align-items:center; cursor:pointer; touch-action:none; margin-bottom:4px; }
  .seek-track { position:relative; width:100%; height:5px; border-radius:5px; background:rgba(255,255,255,.22); }
  .seek:hover .seek-track, .seek.scrubbing .seek-track { height:8px; }
  .seek-buffer { position:absolute; inset:0 auto 0 0; border-radius:5px; background:rgba(255,255,255,.32); width:0; }
  .seek-played { position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--accent); width:0; }
  .seek-knob {
    position:absolute; top:50%; left:0; width:14px; height:14px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%) scale(0);
    transition:transform .12s;
  }
  .seek:hover .seek-knob, .seek.scrubbing .seek-knob { transform:translate(-50%,-50%) scale(1); }
  .seek-tooltip {
    position:absolute; bottom:100%; margin-bottom:8px;
    padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.85); color:#fff; font-size:11px;
    transform:translateX(-50%); pointer-events:none; opacity:0;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .seek:hover .seek-tooltip, .seek.scrubbing .seek-tooltip { opacity:1; }

  .controls { display:flex; align-items:center; gap:10px; margin-top:2px; }
  .controls .spacer { flex:1; }
  .time { font-size:13px; color:#e5e5ea; white-space:nowrap; padding:0 4px; font-variant-numeric:tabular-nums; }
  .time .dim { color:#8a8a94; }

  .av-wrap { position:relative; display:flex; align-items:center; flex:none; }
  .av-panel {
    position:absolute; bottom:calc(100% + 12px); right:0;
    min-width:230px; background:rgba(20,20,24,.96);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:14px 16px;
    z-index:25;
    display:flex; flex-direction:column; gap:14px;
    backdrop-filter:blur(14px);
  }
  .av-panel[hidden] { display:none; }
  .av-row { display:flex; align-items:center; gap:10px; }
  .av-row .av-icon { width:18px; height:18px; fill:#c3c3cd; flex-shrink:0; }
  .av-row input[type="range"] {
    flex:1; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:4px; background:rgba(255,255,255,.18);
    outline:none; cursor:pointer; min-width:0;
  }
  .av-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .av-row input[type="range"]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--accent);
  }
  .av-row .val { font-size:11.5px; color:#8a8a94; min-width:38px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .av-divider { height:1px; background:#2a2a33; margin:-4px 0; }

  .player-overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(0,0,0,.82); color:var(--muted);
    font-size:14px; text-align:center; padding:30px; z-index:4;
  }
  .player-overlay[hidden] { display:none; }
  .player-overlay .err-title { color:#fff; font-size:16px; font-weight:600; }
  .player-overlay .err-msg { max-width:560px; line-height:1.55; font-size:13px; word-break:break-word; }
  .player-overlay .spinner {
    width:36px; height:36px; border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .retry-status {
    position:absolute; top:80px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:rgba(20,20,24,.92);
    border:1px solid rgba(255,255,255,.12);
    padding:10px 16px; border-radius:10px;
    font-size:12.5px; color:#e5e5ea;
    z-index:6; pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    backdrop-filter:blur(12px);
  }
  .retry-status[hidden] { display:none; }
  .retry-status .status-spinner {
    width:14px; height:14px;
    border:2px solid rgba(255,255,255,.2);
    border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  .retry-status.warn { background:rgba(120,53,15,.92); border-color:rgba(245,158,11,.4); }

  .btn {
    display:inline-flex; align-items:center; gap:8px; background:var(--card-2);
    border:1px solid var(--line); color:#fff; padding:11px 20px;
    border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .btn:hover { border-color:#4a4a58; background:#26262f; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
  .error-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  .error-detail {
    max-width:560px; width:100%;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px; padding:12px 14px;
    font-family:ui-monospace,monospace; font-size:11.5px;
    color:#c3c3cd; text-align:left; margin-top:12px;
    max-height:200px; overflow-y:auto; word-break:break-all;
  }
  .error-detail b { color:#93c5fd; }

  .drawer-backdrop {
    position:fixed; inset:0; z-index:790;
    background:rgba(0,0,0,.72);
    animation:fadeIn .2s ease;
  }
  .drawer-backdrop[hidden] { display:none; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .drawer {
    position:fixed; top:0; right:0; bottom:0;
    width:min(380px, 90vw);
    background:#17171c;
    border-left:1px solid #2a2a33;
    z-index:791;
    display:flex; flex-direction:column;
    animation:slideInRight .26s cubic-bezier(.2,.9,.3,1);
    box-shadow:-16px 0 40px rgba(0,0,0,.6);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .drawer[hidden] { display:none; }
  .drawer.closing { animation:slideOutRight .22s ease forwards; }
  @keyframes slideInRight { from { transform:translate3d(100%,0,0); } to { transform:translate3d(0,0,0); } }
  @keyframes slideOutRight { from { transform:translate3d(0,0,0); } to { transform:translate3d(100%,0,0); } }
  .drawer-head {
    display:flex; align-items:center; gap:12px;
    padding:16px 18px 14px; border-bottom:1px solid #2a2a33; flex-shrink:0;
  }
  .drawer-head-text { flex:1; min-width:0; }
  .drawer-eyebrow {
    font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
    color:#6b7280; font-weight:700; margin-bottom:3px;
  }
  .drawer-head h3 { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .drawer-close {
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    color:#fff; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .drawer-close:hover { background:rgba(255,255,255,.14); }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 18px 24px; -webkit-overflow-scrolling:touch; }
  .drawer-loading { display:flex; flex-direction:column; align-items:center; gap:12px; padding:70px 20px; color:#8a8a94; font-size:13px; }
  .drawer-loading .spinner {
    width:30px; height:30px; border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;
  }
  .drawer-section { margin-bottom:22px; }
  .drawer-ep-nav { display:flex; gap:8px; margin-bottom:14px; }
  .drawer-ep-nav-btn {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:#1e1e25; border:1px solid #2a2a33; color:#e5e5ea;
    padding:11px 10px; border-radius:10px;
    font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;
    white-space:nowrap; min-width:0;
  }
  .drawer-ep-nav-btn:hover:not(:disabled) { background:#26262f; border-color:#4a4a58; }
  .drawer-ep-nav-btn:disabled { opacity:.3; cursor:default; }
  .drawer-ep-nav-btn svg { width:14px; height:14px; fill:currentColor; flex-shrink:0; }
  .drawer-ep-nav-btn span { overflow:hidden; text-overflow:ellipsis; }
  .drawer-season-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .drawer-season-row label { font-size:12.5px; color:#8a8a94; font-weight:600; flex-shrink:0; }
  .drawer-season-select {
    flex:1; background:#1e1e25; color:#fff;
    border:1px solid #2a2a33; border-radius:9px;
    padding:10px 12px; font-size:13.5px; font-weight:600;
    font-family:inherit; outline:none; cursor:pointer;
  }
  .drawer-ep-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(56px, 1fr)); gap:8px; }
  .drawer-ep-btn {
    background:#1e1e25; border:1px solid #2a2a33; color:#e5e5ea;
    padding:11px 4px; border-radius:9px; cursor:pointer;
    font-size:12.5px; font-weight:600; font-family:inherit;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  .drawer-ep-btn:hover { background:#26262f; border-color:#4a4a58; }
  .drawer-ep-btn.active {
    background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 0 0 3px rgba(229,9,20,.15);
  }
  .drawer-related-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  .drawer-related-card {
    background:transparent; border:none; padding:0; cursor:pointer;
    text-align:left; color:inherit; font-family:inherit;
    display:flex; flex-direction:column; gap:6px;
    -webkit-tap-highlight-color:transparent;
  }
  .drawer-related-poster {
    position:relative; width:100%; aspect-ratio:2/3;
    border-radius:9px; overflow:hidden; background:#1a1a20;
    border:1px solid #2a2a33;
  }
  .drawer-related-poster img { width:100%; height:100%; object-fit:cover; }
  .drawer-related-badge {
    position:absolute; top:6px; left:6px;
    background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.15);
    color:#fff; font-size:9.5px; font-weight:700;
    padding:2px 6px; border-radius:999px;
    letter-spacing:.4px; text-transform:uppercase;
  }
  .drawer-related-title {
    font-size:12.5px; line-height:1.3; color:#e5e5ea; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; padding:0 2px;
  }
  .drawer-empty { text-align:center; color:#6b7280; font-size:13px; padding:40px 20px; }

  .log-panel { position:fixed; inset:0; z-index:600; background:rgba(13,13,15,.97); display:flex; flex-direction:column; }
  .log-panel[hidden] { display:none; }
  .log-head { display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line); background:#101014; flex-wrap:wrap; }
  .log-head h3 { font-size:13px; flex:0 0 auto; font-weight:700; min-width:80px; }
  .log-btn { background:var(--card-2); border:1px solid var(--line); color:#fff; padding:7px 10px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer; }
  .log-btn.log-close { background:var(--accent); border-color:var(--accent); }
  .log-body { flex:1; overflow-y:auto; padding:8px 10px 40px; font-family:ui-monospace,monospace; font-size:11.5px; line-height:1.5; }
  .log-empty { text-align:center; color:var(--muted); padding:60px 24px; font-size:13px; }
  .log-entry { display:flex; gap:8px; padding:7px 8px; border-radius:6px; margin-bottom:3px; background:rgba(255,255,255,.02); border-left:3px solid #444; font-family:ui-monospace,monospace; font-size:11.5px; }
  .log-entry.LOG { border-left-color:#555; color:#c3c3cd; }
  .log-entry.WARN { border-left-color:#eab308; color:#fde047; background:rgba(234,179,8,.06); }
  .log-entry.ERR { border-left-color:var(--accent); color:#fca5a5; background:rgba(229,9,20,.1); font-weight:600; }
  .log-entry .log-time { color:#6b7280; flex-shrink:0; font-size:10.5px; }
  .log-entry .log-lvl { color:#4b5563; flex-shrink:0; font-size:10px; font-weight:700; }

<script>
/* ═══════════ CONFIG ═══════════ */
const QS = new URLSearchParams(location.search);
let P = {
  detailPath: QS.get("detailPath") || "",
  mainDetailPath: QS.get("mainDetailPath") || QS.get("detailPath") || "",
  subjectId: QS.get("subjectId") || "",
  se: QS.get("se") || "",
  ep: QS.get("ep") || "",
  isSeries: QS.get("isSeries") === "1",
  title: QS.get("title") || "Untitled",
  subtitle: QS.get("subtitle") || "",
  lang: QS.get("lang") || "",
  streamUrl: QS.get("streamUrl") || "",
};

const PROXY_URL = location.origin;
const BASE = "https://officialmoviebox.com";
const HLS_CDN = "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js";

const MAX_STREAM_ATTEMPTS = 8;
const MAX_API_REFRESHES = 2;
const ATTEMPT_TIMEOUT_MS = 15000;
const TOTAL_TIMEOUT_MS = 60000;
const IDLE_MS = 3000;

/* ═══════════ LOGGING ═══════════ */
const LOG = [];
const logBodyEl = document.getElementById("logBody");
const logPanelEl = document.getElementById("logPanel");

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function nowTime() {
  return new Date().toLocaleTimeString("en-GB", { hour12: false });
}
function logPush(level, ...args) {
  const text = args.map(a => typeof a === "object" ? JSON.stringify(a) : String(a)).join(" ");
  LOG.push({ t: nowTime(), l: level, m: text });
  if (LOG.length > 2000) LOG.shift();
  if (!logPanelEl.hidden) renderLogs();
}
const _log = console.log.bind(console);
const _warn = console.warn.bind(console);
const _err = console.error.bind(console);
console.log = (...a) => { _log(...a); logPush("LOG", ...a); };
console.warn = (...a) => { _warn(...a); logPush("WARN", ...a); };
console.error = (...a) => { _err(...a); logPush("ERR", ...a); };

function renderLogs() {
  if (!LOG.length) {
    logBodyEl.innerHTML = '<div class="log-empty">No logs yet.</div>';
    return;
  }
  logBodyEl.innerHTML = LOG.map(e =>

function proxied(realUrl, referer, cookie) {

        + "&referer=" + encodeURIComponent(referer || BASE + "/");
  if (cookie) u += "&cookie=" + encodeURIComponent(cookie);

function absolute(base, path) { return new URL(path, base + "/").toString(); }

  return v.url || v.src || v.path || "";

function pick(obj, ...keys) {
  for (const k of keys) { const v = obj?.[k]; if (v !== undefined && v !== null && v !== "") return v; }
  return undefined;
}

  const s = Math.floor(sec % 60), m = Math.floor((sec / 60) % 60), h = Math.floor(sec / 3600);
  return h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") : m + ":" + String(s).padStart(2, "0");

/* ═══════════ QUALITY DEFAULT PICKER ═══════════ */
function pickStreamIndex(streams, preferredQuality) {
  if (!streams.length) return 0;

  if (preferredQuality != null) {
    const exact = streams.findIndex(s => parseInt(s.quality, 10) === preferredQuality);
    if (exact >= 0) return exact;

    let bestIdx = -1, bestQ = -1;
    for (let i = 0; i < streams.length; i++) {
      const q = parseInt(streams[i].quality, 10);
      if (!isNaN(q) && q <= preferredQuality && q > bestQ) {
        bestQ = q; bestIdx = i;
      }
    }
    if (bestIdx >= 0) return bestIdx;
    return 0;
  }

  // Auto: 720p → 480p → highest
  for (const target of [720, 480]) {
    const idx = streams.findIndex(s => parseInt(s.quality, 10) === target);
    if (idx >= 0) return idx;
  }
  return 0;
}

/* ═══════════ NUXT DECODER ═══════════ */
const DEVALUE_WRAPPERS = {
  "ShallowReactive": v => v, "Reactive": v => v, "Ref": v => v,
  "ShallowRef": v => v, "EmptyRef": () => undefined, "EmptyShallowRef": () => undefined,
  "Set": v => v, "Map": v => v, "Date": v => v, "RegExp": v => v, "BigInt": v => v,
  "null": () => null, "undefined": () => undefined, "NaN": () => NaN,
  "Infinity": () => Infinity, "-Infinity": () => -Infinity,
};
function devalueResolve(arr) {
  const cache = new Map();
  function go(ref) {
    if (ref === null || ref === undefined) return ref;
    if (typeof ref !== "number") return ref;
    if (cache.has(ref)) return cache.get(ref);
    const v = arr[ref];
    if (v === null || v === undefined || typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
      cache.set(ref, v); return v;
    }
    if (Array.isArray(v)) {
      if (v.length >= 1 && typeof v[0] === "string" && DEVALUE_WRAPPERS[v[0]]) {
        const inner = v.length > 1 ? go(v[1]) : undefined;
        const wrapped = DEVALUE_WRAPPERS[v[0]](inner);
        cache.set(ref, wrapped); return wrapped;
      }
      const out = []; cache.set(ref, out);
      for (const item of v) out.push(go(item));
      return out;
    }
    if (typeof v === "object") {
      const out = {}; cache.set(ref, out);
      for (const k of Object.keys(v)) out[k] = go(v[k]);
      return out;
    }
    cache.set(ref, v); return v;
  }
  return go(0);
}
function extractNuxt3Payload(html) {
  const m = html.match(/<script[^>]*id=["']__NUXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try {
    const arr = JSON.parse(m[1]);
    if (!Array.isArray(arr)) return null;
    return devalueResolve(arr);
  } catch (_) { return null; }
}
function findDetailRoot(root) {
  const visited = new WeakSet(); let found = null;
  function walk(node, depth) {
    if (found || depth > 60 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (node.subject && node.subject.subjectId && (node.resource !== undefined || node.metadata !== undefined)) {
      found = node; return;
    }
    if (Array.isArray(node)) { for (const item of node) { walk(item, depth + 1); if (found) return; } return; }
    for (const k of Object.keys(node)) { walk(node[k], depth + 1); if (found) return; }
  }
  walk(root, 0); return found;
}
function findRelatedSubjects(root, excludePath) {
  const seen = new Set(); const out = []; const visited = new WeakSet();
  function walk(node, depth) {
    if (depth > 40 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (Array.isArray(node)) { for (const item of node) walk(item, depth + 1); return; }
    if (typeof node.detailPath === "string" && node.detailPath.length > 0 &&
        node.detailPath !== excludePath &&
        typeof node.title === "string" && node.title.length > 0 &&
        node.cover !== undefined && node.hasResource !== false &&
        !seen.has(node.detailPath)) {
      seen.add(node.detailPath);
      out.push({
        title: node.title,
        detailPath: node.detailPath,
        subjectId: String(node.subjectId || ""),
        image: imgUrl(node.cover),
        isTV: Number(node.subjectType) === 2,
      });
    }
    for (const k of Object.keys(node)) walk(node[k], depth + 1);
  }
  walk(root, 0);
  return out;
}
function normalizeSeasons(rawSeasons, isSeries) {
  if (!Array.isArray(rawSeasons) || !rawSeasons.length) {
    return [{ se: 0, title: "Movie", episodes: [{ ep: 1 }] }];
  }
  const out = [];
  for (const s of rawSeasons) {
    const se = Number(s.se ?? (isSeries ? 1 : 0));
    const resList = Array.isArray(s.resolutions) ? s.resolutions : [];
    let eps = [];
    if (s.allEp) eps = String(s.allEp).split(",").map(n => Number(n.trim())).filter(n => n > 0);
    else if (s.maxEp) eps = Array.from({ length: Number(s.maxEp) }, (_, i) => i + 1);
    if (!eps.length && resList.length) eps = [...new Set(resList.map(r => Number(r.epNum) || 1))].sort((a, b) => a - b);
    if (!eps.length) eps = [1];
    out.push({
      se: isSeries ? (se || 1) : 0,
      title: s.title || (isSeries ? "Season " + (se || 1) : "Movie"),
      episodes: eps.map(ep => ({ ep })),
    });
  }
  return out;
}

/* ═══════════ SERIES INFO FETCH ═══════════ */
async function fetchSeriesInfo() {
  if (!P.isSeries || !P.mainDetailPath || player.seriesLoaded || player.seriesLoading) return;
  player.seriesLoading = true;
  try {
    const realUrl = absolute(BASE, "/moviesDetail/" + P.mainDetailPath);
    const res = await fetch(proxied(realUrl));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const resolved = extractNuxt3Payload(await res.text());
    if (!resolved) throw new Error("No Nuxt payload");
    const detail = findDetailRoot(resolved);
    if (!detail) throw new Error("No subject");

    const subject = detail.subject;
    const resource = detail.resource || {};
    const isSeries = Number(subject.subjectType) === 2;

    player.detailTitle = subject.title || P.title;
    player.detailCover = imgUrl(subject.cover);
    player.detailDescription = subject.description || "";
    player.seasons = normalizeSeasons(resource.seasons || [], isSeries);
    player.detailRelated = findRelatedSubjects(resolved, P.mainDetailPath).filter(r => r.isTV === isSeries);
    player.seriesLoaded = true;

    logPush("LOG", "[series] loaded " + player.seasons.length + " seasons, " + player.detailRelated.length + " related");

    drawerToggleBtn.hidden = false;
    updatePrevNext();
    if (drawerOpen) renderDrawerContent();
  } catch (e) {
    logPush("WARN", "[series] failed:", e.message);
  } finally {
    player.seriesLoading = false;
  }
}

function getPrevNextEp() {
  const seasons = player.seasons;
  const si = seasons.findIndex(s => Number(s.se) === Number(player.currentSe));
  if (si < 0) return { prev: null, next: null };
  const season = seasons[si];
  const eps = season.episodes || [];
  const ei = eps.findIndex(e => Number(e.ep) === Number(player.currentEp));
  if (ei < 0) return { prev: null, next: null };

  let prev = null, next = null;
  if (ei > 0) prev = { se: season.se, ep: eps[ei - 1].ep };
  else if (si > 0) { const ps = seasons[si - 1]; const last = ps.episodes[ps.episodes.length - 1]; if (last) prev = { se: ps.se, ep: last.ep }; }

  if (ei < eps.length - 1) next = { se: season.se, ep: eps[ei + 1].ep };
  else if (si < seasons.length - 1) { const ns = seasons[si + 1]; const first = ns.episodes[0]; if (first) next = { se: ns.se, ep: first.ep }; }

  return { prev, next };
}

function updatePrevNext() {
  if (!P.isSeries || !player.seasons.length) {

  const { prev, next } = getPrevNextEp();

}

/* ═══════════ STREAM FETCHING ═══════════ */
async function fetchStreams(signal) {
  const subjectId = P.subjectId;
  const detailPath = P.detailPath;
  const se = P.isSeries ? Number(P.se) : 0;
  const ep = P.isSeries ? Number(P.ep) : 0;
  if (!subjectId || !detailPath) throw new Error("Missing detailPath or subjectId");

  const watchParams = new URLSearchParams({ id: subjectId, type: "/movie/detail", lang: "en" });
  if (se) watchParams.set("detailSe", String(se));
  if (ep) watchParams.set("detailEp", String(ep));
  const referer = absolute(BASE, "/movies/" + detailPath + "?" + watchParams);

  const playParams = new URLSearchParams({ subjectId: String(subjectId), detailPath });
  if (se && ep) { playParams.set("se", String(se)); playParams.set("ep", String(ep)); }

  const realPlayUrl = absolute(BASE, "/wefeed-h5api-bff/subject/play?" + playParams);
  const fetchUrl = proxied(realPlayUrl, referer);
  logPush("LOG", "[play] fetching:", playParams.toString());

  const res = await fetch(fetchUrl, { signal });
  const body = await res.clone().text();
  let json = null;
  try { json = JSON.parse(body); } catch (_) {}

  if (!res.ok) throw new Error("Play HTTP " + res.status);
  if (!json) throw new Error("Play response not JSON");
  if (json.code !== 0) throw new Error(json.message || "Play code " + json.code);

  return normalizeStreams(json.data, referer);
}

function normalizeStreams(data, pageReferer) {
  if (!data) return { streams: [], signCookie: "" };
  const d = data.data || data;
  const signCookie = String(pick(d, "signCookie", "cookie") || "");
  const containers = ["streams", "hls", "dash", "streamList", "sources", "urls", "list"];
  let list = [];
  for (const key of containers) {
    const v = d[key];
    if (Array.isArray(v) && v.length) list = list.concat(v);
  }
  if (!list.length && pick(d, "url", "playUrl", "src")) list = [d];
  const seen = new Set(), streams = [];
  const cdnReferer = pageReferer || (BASE + "/");

  for (const s of list) {
    if (!s) continue;
    const rawUrl = typeof s === "string" ? s : pick(s, "url", "playUrl", "src", "file", "link") || "";
    if (!rawUrl || seen.has(rawUrl)) continue;
    seen.add(rawUrl);
    const url = rawUrl.startsWith("http") ? proxied(rawUrl, cdnReferer, signCookie) : rawUrl;
    const rawQ = pick(s, "resolutions", "resolution", "quality", "definition", "resName", "label", "name") || "";
    let quality = "Auto";
    if (rawQ) {
      const parts = String(rawQ).split(",");
      const nums = parts.map((v) => parseInt(String(v).trim().replace(/p$/i, ""), 10)).filter((n) => !isNaN(n) && n > 0);
      quality = nums.length ? String(Math.max(...nums)) : String(rawQ).trim();
    }
    streams.push({
      url, quality,
      format: String(pick(s, "format", "type") || "").toUpperCase(),
      id: String(pick(s, "id", "resourceId") || ""),
    });
  }

  // Sort descending by quality
  streams.sort((a, b) => {
    const ai = parseInt(a.quality, 10), bi = parseInt(b.quality, 10);
    if (isNaN(ai) && isNaN(bi)) return 0;
    if (isNaN(ai)) return 1;
    if (isNaN(bi)) return -1;
    return bi - ai;
  });

  // ═══ IMPORTANT: We do NOT cap streams by playConfig.maxResolution ═══
  // The API often reports maxResolution=480, which was hiding 1080p/4K tiers
  // from the user. We surface every stream the API returns so users can pick
  // any quality. Default selection (720p → 480p → highest) is handled
  // separately in startPlayback() via pickStreamIndex().
  const maxRes = Number(d?.playConfig?.maxResolution) || 0;
  if (maxRes > 0) {
    logPush("LOG", "[play] playConfig.maxResolution=" + maxRes + "p (ignored — showing all tiers)");
  }

  logPush("LOG", "[play] got " + streams.length + " streams: " + streams.map(s => s.quality).join(", "));
  return { streams, signCookie };
}

/* ═══════════ PLAYBACK CONTROLLER ═══════════ */
async function startPlayback(opts = {}) {
  const isRetry = opts.isRetry === true;

  playerError.hidden = true;
  playerLoading.hidden = false;
  loadingActions.hidden = true;
  setRetryStatus("");
  loadingText.textContent = "Loading stream...";
  clearTimeout(player.totalTimer);
  clearTimeout(player.attemptTimer);

  player.totalTimer = setTimeout(() => {
    if (video.readyState === 0 || video.ended) {
      logPush("ERR", "[timeout] total elapsed");
      failPlayback("Stream timed out", "The video didn't start within " + (TOTAL_TIMEOUT_MS / 1000) + " seconds.", { reason: "total_timeout" });
    }
  }, TOTAL_TIMEOUT_MS);

  if (player.hls) { try { player.hls.destroy(); } catch (_) {} player.hls = null; }
  if (player.abort) { try { player.abort.abort(); } catch (_) {} }
  player.abort = new AbortController();

  if (!player.seriesLoaded && !player.seriesLoading) fetchSeriesInfo();

  try {
    if (P.streamUrl) {
      setRetryStatus("Attaching direct stream…");
      const stream = { url: P.streamUrl, quality: "Auto", format: /\.m3u8([?#&]|$)/i.test(P.streamUrl) ? "HLS" : "MP4" };
      player.streams = [stream];
      player.currentIdx = 0;
      await tryStream(stream, 0);
      return;
    }
    if (!isRetry || player.streams.length === 0) {
      setRetryStatus("Fetching stream list…");
      loadingText.textContent = "Fetching stream list...";
      const { streams, signCookie } = await fetchStreams(player.abort.signal);
      if (!streams.length) throw new Error("API returned 0 streams");
      player.streams = streams;
      player.signCookie = signCookie || "";

      player.currentIdx = pickStreamIndex(streams, player.preferredQuality);
      const chosen = streams[player.currentIdx];
      logPush("LOG", "[quality] preferred=" +
        (player.preferredQuality == null ? "auto (720→480→highest)" : player.preferredQuality + "p") +
        " → chose " + chosen.quality + "p (idx " + player.currentIdx + ")");

      buildQualityMenu();
      loadCaptionsForCurrentStream();
    }
    setRetryStatus("");
    await tryStream(player.streams[player.currentIdx], player.currentIdx);
  } catch (err) {
    if (err.name === "AbortError") return;
    logPush("ERR", "[play] start failed:", err.message);
    failPlayback("Could not start playback", err.message || "Unknown error");
  }
}

async function tryStream(stream, idx) {
  clearTimeout(player.attemptTimer);
  player.currentIdx = idx;
  const total = player.streams.length;
  const label = stream.quality && stream.quality !== "Auto" ? stream.quality : "Auto";

  player.attemptCount++;
  logPush("LOG", "[stream] attempt " + player.attemptCount + "/" + MAX_STREAM_ATTEMPTS + " → " + label + " (" + idx + "/" + total + ")");

  if (player.attemptCount > MAX_STREAM_ATTEMPTS) {
    return failPlayback("Too many failed attempts", "Tried " + MAX_STREAM_ATTEMPTS + " streams without success.");
  }

  setRetryStatus("Trying stream " + (idx + 1) + "/" + total + " · " + label);
  loadingText.textContent = "Trying " + label + "...";
  loadingActions.hidden = false;

  player.attemptTimer = setTimeout(() => {
    if (video.readyState === 0) {
      logPush("WARN", "[stream] attempt timeout for " + label);
      advanceToNextStream("Stream " + label + " timed out");
    }
  }, ATTEMPT_TIMEOUT_MS);

  if (player.hls) { try { player.hls.destroy(); } catch (_) {} player.hls = null; }
  video.removeAttribute("src");
  try { video.load(); } catch (_) {}

  const url = stream.url;
  player.triedUrls.add(url);
  const isHls = /\.m3u8([?#&]|$)/i.test(url) || /mpegurl/i.test(stream.format);

  try {
    if (isHls && !video.canPlayType("application/vnd.apple.mpegurl")) await attachHls(url);
    else await attachNative(url);
    buildQualityMenu();
  } catch (err) {
    logPush("ERR", "[stream] attach failed:", err.message);
    advanceToNextStream(err.message || "Attach failed");
  }
}

function attachNative(url) {
  return new Promise((resolve, reject) => {
    const onReady = () => {
      clearTimeout(player.attemptTimer);
      video.removeEventListener("canplay", onReady);
      video.removeEventListener("error", onErr);
      playerLoading.hidden = true;
      setRetryStatus("");
      loadingActions.hidden = true;
      video.play().catch(() => {});
      logPush("LOG", "[stream] native playback ready");
      resolve();
    };
    const onErr = () => {
      clearTimeout(player.attemptTimer);
      video.removeEventListener("canplay", onReady);
      video.removeEventListener("error", onErr);
      const code = video.error?.code;
      reject(new Error(code === 4 ? "source not supported" : "video error " + code));
    };
    video.addEventListener("canplay", onReady);
    video.addEventListener("error", onErr);
    video.src = url;
    video.load();
  });
}

async function attachHls(url) {
  const Hls = await loadHlsLib();
  if (!Hls.isSupported()) return attachNative(url);
  return new Promise((resolve, reject) => {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      manifestLoadingTimeOut: 12000,
      manifestLoadingMaxRetry: 1,
      levelLoadingTimeOut: 12000,
      fragLoadingTimeOut: 20000,
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      clearTimeout(player.attemptTimer);
      playerLoading.hidden = true;
      setRetryStatus("");
      loadingActions.hidden = true;
      video.play().catch(() => {});
      logPush("LOG", "[hls] manifest parsed, playing");
      resolve();
    });
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data.fatal) return;
      logPush("ERR", "[hls] fatal:", data.type, data.details);
      clearTimeout(player.attemptTimer);
      try { hls.destroy(); } catch (_) {}
      player.hls = null;
      reject(new Error("HLS " + (data.details || data.type)));
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    player.hls = hls;
  });
}

function loadHlsLib() {
  if (window.Hls) return Promise.resolve(window.Hls);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = HLS_CDN;
    s.onload = () => resolve(window.Hls);
    s.onerror = () => reject(new Error("Failed to load hls.js"));
    document.head.appendChild(s);
  });
}

async function advanceToNextStream(reason) {
  if (player.busy) return;
  player.busy = true;
  clearTimeout(player.attemptTimer);
  try {
    logPush("LOG", "[stream] advancing (reason: " + (reason || "unknown") + ")");
    const total = player.streams.length;
    for (let i = 0; i < total; i++) {
      const nextIdx = (player.currentIdx + 1 + i) % total;
      const next = player.streams[nextIdx];
      if (!next || player.triedUrls.has(next.url)) continue;
      logPush("LOG", "[stream] trying next stream #" + nextIdx);
      await tryStream(next, nextIdx);
      return;
    }
    if (player.apiRefreshes < MAX_API_REFRESHES) {
      player.apiRefreshes++;
      logPush("LOG", "[stream] refreshing play API (" + player.apiRefreshes + "/" + MAX_API_REFRESHES + ")");
      setRetryStatus("Refreshing play API (" + player.apiRefreshes + "/" + MAX_API_REFRESHES + ")…", "warn");
      loadingText.textContent = "Refreshing stream tokens...";
      player.triedUrls.clear();
      player.streams = [];
      await new Promise((r) => setTimeout(r, 1000));
      try {
        const { streams, signCookie } = await fetchStreams(player.abort.signal);
        if (!streams.length) throw new Error("API returned 0 streams on refresh");
        player.streams = streams;
        if (signCookie) player.signCookie = signCookie;

        player.currentIdx = pickStreamIndex(streams, player.preferredQuality);
        buildQualityMenu();
        logPush("LOG", "[stream] API refresh returned " + streams.length + " fresh streams");
        await tryStream(streams[player.currentIdx], player.currentIdx);
        return;
      } catch (e) { logPush("ERR", "[stream] API refresh failed:", e.message); }
    }
    logPush("ERR", "[stream] giving up");
    failPlayback("All streams failed", "Tried " + player.attemptCount + " attempts across " + player.streams.length + " streams" + (player.apiRefreshes ? " (" + player.apiRefreshes + " API refreshes)" : "") + ".");
  } finally { player.busy = false; }
}

function failPlayback(title, message, extra) {
  clearTimeout(player.totalTimer);
  clearTimeout(player.attemptTimer);
  if (player.hls) { try { player.hls.destroy(); } catch (_) {} player.hls = null; }
  setRetryStatus("");
  playerLoading.hidden = true;
  loadingActions.hidden = true;
  logPush("ERR", "[fail] " + title + " — " + message);
  playerError.hidden = false;
  playerErrorMsg.innerHTML = escapeHtml(message);
  if (extra || player.triedUrls.size) {
    playerErrorDetail.hidden = false;
    const details = [];
    details.push("<b>Attempts:</b> " + player.attemptCount);
    details.push("<b>API refreshes:</b> " + player.apiRefreshes);
    details.push("<b>Streams tried:</b> " + player.triedUrls.size);
    if (player.streams.length) details.push("<b>Total streams:</b> " + player.streams.length);
    if (extra?.reason) details.push("<b>Reason:</b> " + extra.reason);
    playerErrorDetail.innerHTML = details.join("<br>");
  } else { playerErrorDetail.hidden = true; }
}

/* ═══════════ MOBILE LANDSCAPE FULLSCREEN ═══════════ */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  (window.matchMedia("(hover: none) and (pointer: coarse)").matches);

function isLandscapeNow() {
  if (screen.orientation && screen.orientation.type) {
    return screen.orientation.type.startsWith("landscape");
  }
  return window.innerWidth > window.innerHeight;
}

function isCurrentlyFullscreen() {
  return !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.msFullscreenElement
  );
}

let _fsIntentPending = false;
let _lastEntryWasAuto = false;

async function requestMobileFullscreen() {
  if (!IS_MOBILE) return false;
  if (!isLandscapeNow()) return false;
  if (isCurrentlyFullscreen()) return false;

  const el = document.documentElement;
  _lastEntryWasAuto = true;

  try {
    if (el.requestFullscreen) {
      await el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
      await el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      await el.msRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      try { video.webkitEnterFullscreen(); } catch (_) {}
      return true;
    } else {
      _lastEntryWasAuto = false;
      return false;
    }
    return true;
  } catch (_) {
    _lastEntryWasAuto = false;
    return false;
  }
}

function exitMobileFullscreen() {
  if (!IS_MOBILE) return;
  if (!isCurrentlyFullscreen()) return;
  try {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  } catch (_) {}
  _lastEntryWasAuto = false;
}

let _orientDebounce = null;
function onOrientationChanged() {
  if (!IS_MOBILE) return;
  clearTimeout(_orientDebounce);
  _orientDebounce = setTimeout(() => {
    if (isLandscapeNow()) {
      if (!video.paused || playbackStarted) {
        requestMobileFullscreen().then((ok) => {
          if (!ok) _fsIntentPending = true;
        });
      }
    } else {
      _fsIntentPending = false;
      if (_lastEntryWasAuto) exitMobileFullscreen();
    }
  }, 250);
}

if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener("change", onOrientationChanged);
}
window.addEventListener("orientationchange", () => setTimeout(onOrientationChanged, 100));
window.addEventListener("resize", onOrientationChanged);

document.addEventListener("pointerdown", () => {
  if (!IS_MOBILE || !_fsIntentPending) return;
  if (!isLandscapeNow() || isCurrentlyFullscreen()) {
    _fsIntentPending = false;
    return;
  }
  _fsIntentPending = false;
  requestMobileFullscreen();
}, { capture: true });

document.addEventListener("fullscreenchange", () => {
  if (!isCurrentlyFullscreen()) {
    _fsIntentPending = false;
    _lastEntryWasAuto = false;
  }
});
document.addEventListener("webkitfullscreenchange", () => {
  if (!isCurrentlyFullscreen()) {
    _fsIntentPending = false;
    _lastEntryWasAuto = false;
  }
});

let scrubbing = false;
seekEl.addEventListener("pointerdown", (e) => {
  scrubbing = true;
  seekEl.classList.add("scrubbing");
  seekEl.setPointerCapture(e.pointerId);
  applySeek(e, false);
});
seekEl.addEventListener("pointermove", (e) => {
  if (scrubbing) applySeek(e, false);
  else {
    if (!video.duration) return;
    const r = seekEl.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    seekTooltip.style.left = ratio * 100 + "%";
    seekTooltip.textContent = formatTime(ratio * video.duration);
  }
});
seekEl.addEventListener("pointerup", (e) => {
  if (!scrubbing) return;
  scrubbing = false;
  seekEl.classList.remove("scrubbing");
  applySeek(e, true);
});
function applySeek(e, update) {
  if (!video.duration) return;
  const r = seekEl.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const t = ratio * video.duration;
  seekPlayed.style.width = ratio * 100 + "%";
  seekKnob.style.left = ratio * 100 + "%";
  seekTooltip.style.left = ratio * 100 + "%";
  seekTooltip.textContent = formatTime(t);
  timeCur.textContent = formatTime(t);
  if (update) video.currentTime = t;
}

async function loadCaptionsForCurrentStream() {
  const stream = player.streams[0];
  if (!stream || !stream.id || !stream.format) { capWrap.hidden = true; return; }
  try {
    const params = new URLSearchParams({
      format: stream.format, id: stream.id,
      subjectId: P.subjectId, detailPath: P.detailPath,
    });
    const url = absolute(BASE, "/wefeed-h5api-bff/subject/caption?" + params);
    const referer = absolute(BASE, "/movies/" + P.detailPath);
    const res = await fetch(proxied(url, referer));
    if (!res.ok) { capWrap.hidden = true; return; }
    const json = await res.json();
    const raw = json?.data?.captions || json?.data?.captionList || json?.data?.list || [];
    if (!raw.length) { capWrap.hidden = true; return; }
    player.captions = raw.map(c => ({
      lang: pick(c, "lan", "lang") || "",
      name: pick(c, "lanName", "language", "label") || "Subtitle",
      url: pick(c, "url", "src", "file") || "",
    })).filter(c => c.url);
    capWrap.hidden = player.captions.length === 0;
    if (player.captions.length) buildCaptionMenu();
  } catch (_) { capWrap.hidden = true; }
}
function buildCaptionMenu() {
  capList.innerHTML =
    '<button data-c="-1"' + (player.captionIndex === -1 ? ' class="active"' : '') + '><span>Off</span><span class="check">✓</span></button>' +
    player.captions.map((c, i) =>
      `<button data-c="${i}"${i === player.captionIndex ? ' class="active"' : ''}><span>${escapeHtml(c.name)}</span><span class="check">✓</span></button>`
    ).join("") +
    '<div style="height:1px;background:#2a2a33;margin:4px 0;"></div>' +
    '<button data-action="settings"><span>⚙ Caption Style</span><span class="check"></span></button>';

  capList.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.action === "settings") {
        capList.hidden = true;
        capBtn.classList.remove("open");
        openCapSettings();
        return;
      }
      const i = Number(btn.dataset.c);
      capList.hidden = true;
      capBtn.classList.remove("open");
      if (i === -1) deselectCaption();
      else selectCaption(i);
    });
  });
}
function deselectCaption() {
  player.captionIndex = -1;
  removeCaptionTrack();
  buildCaptionMenu();
  capLabel.textContent = "CC";
}
async function selectCaption(idx) {
  const cap = player.captions[idx];
  if (!cap) return;
  try {
    const referer = absolute(BASE, "/movies/" + P.detailPath);
    const res = await fetch(proxied(cap.url, referer));
    if (!res.ok) throw new Error("HTTP " + res.status);
    let text = await res.text();
    if (!/^\s*WEBVTT/i.test(text)) {
      text = "WEBVTT\n\n" + text.replace(/\r+/g, "").replace(/^\d+\s*$/gm, "").replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
    }
    applyCaptionTrack(text, cap.name);
    player.captionIndex = idx;
    capLabel.textContent = (cap.name || "CC").toUpperCase().slice(0, 8);
    buildCaptionMenu();
  } catch (e) { logPush("ERR", "[cap] failed:", e.message); }
}
function removeCaptionTrack() {
  if (player.captionTrackEl) { try { player.captionTrackEl.remove(); } catch (_) {} player.captionTrackEl = null; }
  if (player.captionBlobUrl) { try { URL.revokeObjectURL(player.captionBlobUrl); } catch (_) {} player.captionBlobUrl = null; }
  if (captionOverlay) { captionOverlay.hidden = true; captionOverlay.innerHTML = ""; }
}
function applyCaptionTrack(vttText, label) {
  removeCaptionTrack();
  const blob = new Blob([vttText], { type: "text/vtt;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const track = document.createElement("track");
  track.kind = "subtitles"; track.label = label || "Subtitle"; track.srclang = "en"; track.src = url; track.default = true;
  video.appendChild(track);
  player.captionTrackEl = track;
  player.captionBlobUrl = url;
  setTimeout(() => {
    const tt = track.track;
    if (!tt) return;
    tt.mode = "hidden";
    tt.addEventListener("cuechange", renderCues);
  }, 200);
}
function renderCues(e) {
  const tt = e.target;
  if (!tt || !captionOverlay) return;
  if (player.captionIndex === -1) { captionOverlay.hidden = true; return; }
  const cues = tt.activeCues;
  if (!cues || !cues.length) { captionOverlay.hidden = true; return; }

  const lines = [];
  for (let i = 0; i < cues.length; i++) {
    const raw = (cues[i].text || "").replace(/<[^>]+>/g, "").trim();
    if (!raw) continue;
    raw.split(/\r?\n/).forEach(l => {
      const t = l.trim();
      if (t) lines.push(t);
    });
  }
  if (!lines.length) { captionOverlay.hidden = true; return; }
  captionOverlay.innerHTML = lines
    .map(l => '<div class="cap-line">' + escapeHtml(l) + "</div>")
    .join("");
  captionOverlay.hidden = false;
}

/* ═══════════ CAPTION STYLE SETTINGS ═══════════ */
const CAP_STYLE_KEY = "playerCaptionStyle";
const DEFAULT_CAP_STYLE = {

  textColor: "#ffffff",
  textOpacity: 100,
  bgColor: "#000000",
  bgOpacity: 50,

function loadCapStyle() {

    if (!raw) return { ...DEFAULT_CAP_STYLE };

}

function hexToRgba(hex, alpha) {
  const h = String(hex || "#000000").replace("#", "");
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  return "rgba(" + r + "," + g + "," + b + "," + Math.max(0, Math.min(1, alpha)) + ")";
}

function buildCapCssVars() {
  const fontMap = {
    sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
    serif: 'Georgia, "Times New Roman", serif',
    mono: 'ui-monospace, "Courier New", Consolas, monospace',
  };
  const sizeEm = (capStyle.size / 100) * 1.2;
  return {
    "--cap-font-family": fontMap[capStyle.font] || fontMap.sans,
    "--cap-font-size": sizeEm + "em",
    "--cap-font-weight": capStyle.bold ? "700" : "400",
    "--cap-text-color": hexToRgba(capStyle.textColor, capStyle.textOpacity / 100),
    "--cap-bg-color": hexToRgba(capStyle.bgColor, capStyle.bgOpacity / 100),
    "--cap-text-shadow": capStyle.shadow ? "0 1px 3px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,0.9)" : "none",
  };
}

function applyCapStyle() {
  const vars = buildCapCssVars();
  for (const el of [captionOverlay, capSettingsPreview]) {
    for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
  }
  captionOverlay.style.bottom = capStyle.position + "%";

  const previewLine = capSettingsPreview.querySelector(".cap-line");
  if (previewLine) previewLine.style.bottom = capStyle.position + "%";
}

function updateCapUI() {
  document.getElementById("capFontFamily").value = capStyle.font;
  document.getElementById("capFontSize").value = capStyle.size;
  document.getElementById("capFontSizeVal").textContent = capStyle.size + "%";
  document.getElementById("capTextColor").value = capStyle.textColor;
  document.getElementById("capTextOpacity").value = capStyle.textOpacity;
  document.getElementById("capTextOpacityVal").textContent = capStyle.textOpacity + "%";
  document.getElementById("capBgColor").value = capStyle.bgColor;
  document.getElementById("capBgOpacity").value = capStyle.bgOpacity;
  document.getElementById("capBgOpacityVal").textContent = capStyle.bgOpacity + "%";
  document.getElementById("capPosition").value = capStyle.position;
  document.getElementById("capPositionVal").textContent = capStyle.position + "%";
  document.getElementById("capBold").checked = capStyle.bold;
  document.getElementById("capShadow").checked = capStyle.shadow;
}

function openCapSettings() {
  updateCapUI();
  applyCapStyle();
  capSettingsPanel.hidden = false;
  capSettingsBackdrop.hidden = false;
  playerUI.classList.remove("idle");
  clearTimeout(idleTimer);
}
function closeCapSettings() {
  capSettingsPanel.hidden = true;
  capSettingsBackdrop.hidden = true;
  resetIdleTimer();
}

document.getElementById("capFontFamily").addEventListener("change", (e) => {
  capStyle.font = e.target.value; saveCapStyle(); applyCapStyle();
});
document.getElementById("capFontSize").addEventListener("input", (e) => {
  capStyle.size = Number(e.target.value);
  document.getElementById("capFontSizeVal").textContent = capStyle.size + "%";
  saveCapStyle(); applyCapStyle();
});
document.getElementById("capTextColor").addEventListener("input", (e) => {
  capStyle.textColor = e.target.value; saveCapStyle(); applyCapStyle();
});
document.getElementById("capTextOpacity").addEventListener("input", (e) => {
  capStyle.textOpacity = Number(e.target.value);
  document.getElementById("capTextOpacityVal").textContent = capStyle.textOpacity + "%";
  saveCapStyle(); applyCapStyle();
});
document.getElementById("capBgColor").addEventListener("input", (e) => {
  capStyle.bgColor = e.target.value; saveCapStyle(); applyCapStyle();
});
document.getElementById("capBgOpacity").addEventListener("input", (e) => {
  capStyle.bgOpacity = Number(e.target.value);
  document.getElementById("capBgOpacityVal").textContent = capStyle.bgOpacity + "%";
  saveCapStyle(); applyCapStyle();
});
document.getElementById("capPosition").addEventListener("input", (e) => {
  capStyle.position = Number(e.target.value);
  document.getElementById("capPositionVal").textContent = capStyle.position + "%";
  saveCapStyle(); applyCapStyle();
});
document.getElementById("capBold").addEventListener("change", (e) => {
  capStyle.bold = e.target.checked; saveCapStyle(); applyCapStyle();
});
document.getElementById("capShadow").addEventListener("change", (e) => {
  capStyle.shadow = e.target.checked; saveCapStyle(); applyCapStyle();
});
document.getElementById("capSettingsReset").addEventListener("click", () => {
  capStyle = { ...DEFAULT_CAP_STYLE };
  saveCapStyle();
  updateCapUI();
  applyCapStyle();
});
document.getElementById("capSettingsDone").addEventListener("click", closeCapSettings);
document.getElementById("capSettingsClose").addEventListener("click", closeCapSettings);
capSettingsBackdrop.addEventListener("click", closeCapSettings);

/* ═══════════ DRAWER ═══════════ */
let drawerOpen = false;

function openDrawer() {
  if (drawerOpen) return;
  drawerOpen = true;
  document.body.classList.add("drawer-open");
  drawerEl.hidden = false;
  drawerBackdrop.hidden = false;
  playerUI.classList.remove("idle");
  renderDrawerContent();
}
function closeDrawer() {
  if (!drawerOpen) return;
  drawerOpen = false;
  drawerEl.classList.add("closing");
  setTimeout(() => {
    drawerEl.classList.remove("closing");
    drawerEl.hidden = true;
    drawerBackdrop.hidden = true;
    document.body.classList.remove("drawer-open");
  }, 220);
}
drawerToggleBtn.addEventListener("click", (e) => { e.stopPropagation(); openDrawer(); });
document.getElementById("drawerClose").addEventListener("click", (e) => { e.stopPropagation(); closeDrawer(); });
drawerBackdrop.addEventListener("click", () => closeDrawer());
drawerEl.addEventListener("click", (e) => e.stopPropagation());

function renderDrawerContent() {
  if (player.seriesLoading) {
    drawerBody.innerHTML = '<div class="drawer-loading"><div class="spinner"></div>Loading…</div>';
    return;
  }
  if (P.isSeries && player.seasons.length) {
    drawerEyebrow.textContent = "Browse";
    drawerTitle.textContent = "Episodes";
    renderDrawerEpisodes();
  } else if (player.detailRelated.length) {
    drawerEyebrow.textContent = "Discover";
    drawerTitle.textContent = "Related";
    renderDrawerRelated();
  } else {
    drawerEyebrow.textContent = "Info";
    drawerTitle.textContent = "No additional info";
    drawerBody.innerHTML = '<div class="drawer-empty">No episodes or related titles available.</div>';
  }
}

function renderDrawerEpisodes() {
  let si = player.seasons.findIndex(s => Number(s.se) === Number(player.currentSe));
  if (si < 0) si = 0;
  const season = player.seasons[si];

  const seasonSelect = player.seasons.length > 1
    ? `<div class="drawer-season-row">
        <label>Season</label>
        <select class="drawer-season-select" id="drawerSeasonSelect">
          ${player.seasons.map((s, i) => `<option value="${i}"${i === si ? " selected" : ""}>${escapeHtml(s.title)}</option>`).join("")}
        </select>
      </div>`
    : "";

  const { prev, next } = getPrevNextEp();
  const navHtml = `<div class="drawer-ep-nav">
    <button class="drawer-ep-nav-btn" id="drawerPrevEp"${prev ? "" : " disabled"}>
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      <span>Previous</span>
    </button>
    <button class="drawer-ep-nav-btn" id="drawerNextEp"${next ? "" : " disabled"}>
      <span>Next</span>
      <svg viewBox="0 0 24 24"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
    </button>
  </div>`;

  const epBtns = season.episodes.map(e => {
    const isCurrent = Number(season.se) === Number(player.currentSe) && Number(e.ep) === Number(player.currentEp);
    return `<button class="drawer-ep-btn${isCurrent ? " active" : ""}" data-se="${season.se}" data-ep="${e.ep}">E${String(e.ep).padStart(2, "0")}</button>`;
  }).join("");

  drawerBody.innerHTML = `<div class="drawer-section">${navHtml}${seasonSelect}<div class="drawer-ep-grid">${epBtns}</div></div>`;

  const prevBtn = document.getElementById("drawerPrevEp");
  if (prevBtn && prev) prevBtn.addEventListener("click", () => navigateToEpisode(prev.se, prev.ep));
  const nextBtn = document.getElementById("drawerNextEp");
  if (nextBtn && next) nextBtn.addEventListener("click", () => navigateToEpisode(next.se, next.ep));

  const sel = document.getElementById("drawerSeasonSelect");
  if (sel) sel.addEventListener("change", (ev) => {
    const newSi = Number(ev.target.value);
    renderDrawerSeasonEpisodes(player.seasons[newSi]);
  });

  drawerBody.querySelectorAll(".drawer-ep-btn").forEach(btn => {
    btn.addEventListener("click", () => navigateToEpisode(Number(btn.dataset.se), Number(btn.dataset.ep)));
  });
}

function renderDrawerSeasonEpisodes(season) {
  const epBtns = season.episodes.map(e => {
    const isCurrent = Number(season.se) === Number(player.currentSe) && Number(e.ep) === Number(player.currentEp);
    return `<button class="drawer-ep-btn${isCurrent ? " active" : ""}" data-se="${season.se}" data-ep="${e.ep}">E${String(e.ep).padStart(2, "0")}</button>`;
  }).join("");
  const grid = drawerBody.querySelector(".drawer-ep-grid");
  if (grid) {
    grid.innerHTML = epBtns;
    grid.querySelectorAll(".drawer-ep-btn").forEach(btn => {
      btn.addEventListener("click", () => navigateToEpisode(Number(btn.dataset.se), Number(btn.dataset.ep)));
    });
  }
}

function renderDrawerRelated() {
  const cards = player.detailRelated.slice(0, 30).map(it => {
    const img = it.image
      ? `<img src="${escapeHtml(it.image)}" alt="" loading="lazy" onerror="this.style.display='none'" />`
      : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:rgba(255,255,255,.3);background:linear-gradient(135deg,#1e1e25 0%,#2a2a33 100%)">${escapeHtml((it.title || "?").charAt(0).toUpperCase())}</div>`;
    const badge = it.isTV ? '<span class="drawer-related-badge">TV</span>' : '';
    return `<button class="drawer-related-card" data-detail="${escapeHtml(it.detailPath)}" data-subject="${escapeHtml(it.subjectId)}">
      <div class="drawer-related-poster">${img}${badge}</div>
      <div class="drawer-related-title">${escapeHtml(it.title)}</div>
    </button>`;
  }).join("");

  drawerBody.innerHTML = `<div class="drawer-section"><div class="drawer-related-grid">${cards}</div></div>`;

  drawerBody.querySelectorAll(".drawer-related-card").forEach(btn => {
    btn.addEventListener("click", () => {
      const dp = btn.dataset.detail;
      const sid = btn.dataset.subject;
      if (!dp) return;
      const params = new URLSearchParams({
        detailPath: dp, mainDetailPath: dp, subjectId: sid,
        isSeries: "1", title: "", subtitle: "", lang: "Original Audio",
        se: "1", ep: "1",
      });
      location.href = "player.html?" + params.toString();
    });
  });
}

/* ═══════════ PLAYER ACTIONS ═══════════ */
document.getElementById("loadingSkip").addEventListener("click", () => {
  logPush("LOG", "[user] skip to next stream");
  advanceToNextStream("user skipped");
});
document.getElementById("loadingGiveup").addEventListener("click", () => {
  logPush("LOG", "[user] give up");
  failPlayback("Cancelled", "You stopped trying to play this stream.");
});
document.getElementById("playerRetry").addEventListener("click", () => {
  player.attemptCount = 0;
  player.apiRefreshes = 0;
  player.triedUrls.clear();
  player.streams = [];
  startPlayback({ isRetry: false });
});
document.getElementById("playerShowLogs2").addEventListener("click", () => {
  logPanelEl.hidden = false;
  renderLogs();
});
document.getElementById("playerBack2").addEventListener("click", () => {
  if (history.length > 1) history.back();
  else location.href = "index.html";
});
document.getElementById("btnNetInspector").addEventListener("click", () => {
  logPanelEl.hidden = !logPanelEl.hidden;
  if (!logPanelEl.hidden) renderLogs();
});

/* ═══════════ KEYBOARD ═══════════ */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "Escape") {
    if (!capSettingsPanel.hidden) { closeCapSettings(); return; }
    if (!logPanelEl.hidden) { logPanelEl.hidden = true; return; }
    if (drawerOpen) { closeDrawer(); return; }
    if (history.length > 1) history.back();
    else location.href = "index.html";
    return;
  }
  switch (e.key) {
    case " ": case "k": case "K": e.preventDefault(); togglePlay(); break;
    case "ArrowRight": e.preventDefault(); if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10); break;
    case "ArrowLeft": e.preventDefault(); if (video.duration) video.currentTime = Math.max(0, video.currentTime - 10); break;
    case "ArrowUp": e.preventDefault(); video.volume = Math.min(1, video.volume + 0.05); volumeSlider.value = video.volume; break;
    case "ArrowDown": e.preventDefault(); video.volume = Math.max(0, video.volume - 0.05); volumeSlider.value = video.volume; break;
    case "m": case "M": e.preventDefault(); video.muted = !video.muted; break;
    case "f": case "F": e.preventDefault(); toggleFullscreen(); break;
    case "b": case "B": e.preventDefault(); if (drawerOpen) closeDrawer(); else if (!drawerToggleBtn.hidden) openDrawer(); break;
    case "l": case "L": e.preventDefault(); logPanelEl.hidden = !logPanelEl.hidden; if (!logPanelEl.hidden) renderLogs(); break;
    case "c": case "C": e.preventDefault(); if (!capWrap.hidden) { capList.hidden = !capList.hidden; capBtn.classList.toggle("open", !capList.hidden); } break;
    case "q": case "Q": e.preventDefault(); if (!qualityWrap.hidden) { qualityList.hidden = !qualityList.hidden; qualityBtn.classList.toggle("open", !qualityList.hidden); } break;
    case "[": e.preventDefault(); brightSlider.value = Math.max(0.2, Number(brightSlider.value) - 0.1); brightSlider.dispatchEvent(new Event("input")); break;
    case "]": e.preventDefault(); brightSlider.value = Math.min(2, Number(brightSlider.value) + 0.1); brightSlider.dispatchEvent(new Event("input")); break;
  }
});

/* ═══════════ FULLSCREEN / PIP ═══════════ */
async function toggleFullscreen() {
  if (isCurrentlyFullscreen()) {
    _lastEntryWasAuto = false;
    try {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    } catch (_) {}
    try {
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    } catch (_) {}
    return;
  }

  _lastEntryWasAuto = false;
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen();
    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) await el.msRequestFullscreen();
  } catch (_) {
    return;
  }

  if (IS_MOBILE) {
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape").catch(() => {});
      }
    } catch (_) {}
  }
}
document.getElementById("btnFull").addEventListener("click", toggleFullscreen);
document.getElementById("btnPip").addEventListener("click", async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  } catch (_) {}
});
document.getElementById("btnRewind").addEventListener("click", () => {
  if (video.duration) video.currentTime = Math.max(0, video.currentTime - 10);
  showFeedback("-10s");
});
document.getElementById("btnForward").addEventListener("click", () => {
  if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10);
  showFeedback("+10s");
});

/* ═══════════ NAVIGATION ═══════════ */
document.getElementById("playerBack").addEventListener("click", () => {
  if (history.length > 1) history.back();
  else location.href = "index.html";
});
document.getElementById("playerHome").addEventListener("click", () => {
  location.href = "index.html";
});

window.addEventListener("popstate", () => {
  const url = new URL(location.href);
  const q = url.searchParams;
  const newSe = q.get("se") || "";
  const newEp = q.get("ep") || "";
  if (newSe !== P.se || newEp !== P.ep) {
    P.se = newSe;
    P.ep = newEp;
    player.currentSe = Number(newSe) || 0;
    player.currentEp = Number(newEp) || 1;
    resetPlayerForNewEpisode();
    startPlayback({ isRetry: false });
  }
});

/* ═══════════ AD GATE ═══════════ */
function hideAdGate() {
  const gate = document.getElementById("adGate");
  if (!gate) return;
  gate.classList.add("hide");
  setTimeout(() => gate.remove(), 320);
}
async function startWithAd() {
  const btn = document.getElementById("adGateBtn");
  const status = document.getElementById("adGateStatus");
  if (!btn || btn.disabled) return;

  if (IS_MOBILE && isLandscapeNow() && !isCurrentlyFullscreen()) {
    requestMobileFullscreen();
  }

  btn.disabled = true;
  status.classList.remove("err");
  status.textContent = "Loading ad…";
  try {
    if (typeof show_10973078 !== "function") throw new Error("Ad SDK not loaded");
    await show_10973078();
    status.textContent = "Starting video…";
  } catch (e) {
    logPush("WARN", "[ad] failed:", e.message);
    status.classList.add("err");
    status.textContent = "Ad unavailable — starting anyway…";
    await new Promise(r => setTimeout(r, 600));
  }
  hideAdGate();
  startPlayback({ isRetry: false });
}

/* ═══════════ BOOT ═══════════ */
playerTitle.textContent = P.title;
playerSub.textContent = P.subtitle;
player.currentSe = Number(P.se) || 0;
player.currentEp = Number(P.ep) || 1;
if (P.isSeries) drawerToggleBtn.hidden = false;

applyCapStyle();
updateCapUI();

if (!P.streamUrl && (!P.detailPath || !P.subjectId)) {
  failPlayback("Missing URL parameters", "Open this page from the catalog.");
  hideAdGate();
} else {
  playerLoading.hidden = true;
  document.getElementById("adGateBtn").addEventListener("click", startWithAd);
}
</script>
